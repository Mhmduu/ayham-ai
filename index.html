<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ayham AI</title>

  <meta
    name="description"
    content="Ayham AI - مساعدك الذكي"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    :root {
      --bg: #0b0d10;
      --panel: #111418;
      --panel2: #171a1f;
      --panel3: #20242a;

      --border: rgba(255,255,255,.08);

      --text: #f4f4f5;
      --muted: #9ca3af;

      --green: #19c37d;
      --green2: #13a86c;

      --danger: #ef4444;

      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: var(--bg);
      color: var(--text);

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================
       APP
    ========================================= */

    .app {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* =========================================
       SIDEBAR
    ========================================= */

    .sidebar {
      width: 280px;
      flex-shrink: 0;

      background: #101215;

      border-left: 1px solid var(--border);

      display: flex;
      flex-direction: column;

      padding: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;

      padding: 10px 8px 18px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;

      border-radius: 12px;

      display: grid;
      place-items: center;

      background: linear-gradient(
        135deg,
        #19c37d,
        #0e9f67
      );

      color: white;

      font-size: 18px;
      font-weight: 800;
    }

    .brand-text {
      font-weight: 800;
      font-size: 18px;
    }

    .new-chat {
      width: 100%;

      border: 1px solid var(--border);

      background: #191c20;

      color: white;

      padding: 12px 14px;

      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      transition: .2s;
    }

    .new-chat:hover {
      background: #22262c;
    }

    .chat-list {
      flex: 1;

      overflow-y: auto;

      margin-top: 18px;
    }

    .chat-item {
      width: 100%;

      border: 0;

      background: transparent;

      color: #ddd;

      text-align: right;

      padding: 11px 12px;

      border-radius: 10px;

      margin-bottom: 4px;

      display: flex;
      align-items: center;

      gap: 8px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item:hover {
      background: #1b1e23;
    }

    .chat-item.active {
      background: #24282e;
    }

    .chat-title {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border);

      padding-top: 12px;
    }

    .account {
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 10px;

      border-radius: 12px;

      background: #15181c;
    }

    .avatar {
      width: 36px;
      height: 36px;

      border-radius: 50%;

      display: grid;
      place-items: center;

      background: #30343b;

      font-weight: 700;

      flex-shrink: 0;
    }

    .account-info {
      min-width: 0;
      flex: 1;
    }

    .account-name {
      font-size: 14px;
      font-weight: 700;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .account-email {
      font-size: 11px;
      color: var(--muted);

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .logout {
      border: 0;
      background: transparent;
      color: #aaa;

      padding: 7px;

      border-radius: 8px;
    }

    .logout:hover {
      background: #272b31;
      color: white;
    }

    /* =========================================
       MAIN
    ========================================= */

    .main {
      min-width: 0;
      flex: 1;

      display: flex;
      flex-direction: column;

      position: relative;
    }

    .topbar {
      height: 60px;

      display: flex;
      align-items: center;

      padding: 0 18px;

      border-bottom: 1px solid var(--border);

      background: rgba(11,13,16,.86);

      backdrop-filter: blur(12px);

      position: relative;
      z-index: 10;
    }

    .mobile-menu {
      display: none;

      border: 0;

      background: transparent;

      color: white;

      font-size: 22px;

      margin-left: 8px;
    }

    .top-title {
      font-weight: 700;
      font-size: 15px;
    }

    .status {
      margin-right: auto;

      display: flex;
      align-items: center;
      gap: 7px;

      color: var(--muted);

      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--green);
    }

    /* =========================================
       CHAT
    ========================================= */

    .messages {
      flex: 1;

      overflow-y: auto;

      padding: 35px 20px 150px;
    }

    .messages-inner {
      max-width: 850px;

      margin: auto;
    }

    .welcome {
      min-height: 55vh;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .welcome-logo {
      width: 68px;
      height: 68px;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          #19c37d,
          #0b8255
        );

      display: grid;
      place-items: center;

      font-size: 28px;
      font-weight: 900;

      box-shadow:
        0 15px 45px rgba(25,195,125,.18);
    }

    .welcome h1 {
      margin: 20px 0 8px;

      font-size: 30px;
    }

    .welcome p {
      margin: 0;

      color: var(--muted);

      max-width: 500px;
      line-height: 1.8;
    }

    .message {
      display: flex;

      gap: 13px;

      margin-bottom: 26px;

      animation: fadeIn .2s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 34px;
      height: 34px;

      border-radius: 50%;

      flex-shrink: 0;

      display: grid;
      place-items: center;

      font-size: 12px;
      font-weight: 800;

      background: #2c3036;
    }

    .message.user .message-avatar {
      background: #19a96f;
    }

    .message-body {
      max-width: min(720px, 85%);
    }

    .message-name {
      font-size: 12px;
      color: var(--muted);

      margin-bottom: 5px;
    }

    .message.user .message-name {
      text-align: right;
    }

    .message-content {
      line-height: 1.9;

      white-space: pre-wrap;

      word-break: break-word;

      font-size: 15px;
    }

    .message.user .message-content {
      background: #20242a;

      padding: 10px 14px;

      border-radius: 15px;

      display: inline-block;
    }

    .assistant-actions {
      display: flex;

      gap: 5px;

      margin-top: 8px;
    }

    .assistant-actions button {
      border: 0;

      background: transparent;

      color: #777;

      padding: 5px 8px;

      border-radius: 7px;

      font-size: 12px;
    }

    .assistant-actions button:hover {
      background: #20242a;
      color: white;
    }

    /* =========================================
       ATTACHMENTS
    ========================================= */

    .attachment-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));

      gap: 10px;

      margin-top: 10px;

      max-width: 650px;
    }

    .attachment-card {
      overflow: hidden;

      border: 1px solid var(--border);

      background: #171a1e;

      border-radius: 12px;

      padding: 8px;
    }

    .attachment-card img,
    .attachment-card video {
      display: block;

      width: 100%;

      max-height: 300px;

      object-fit: cover;

      border-radius: 8px;
    }

    .attachment-card audio {
      width: 100%;
    }

    .file-card {
      display: flex;
      align-items: center;

      gap: 10px;

      padding: 10px;
    }

    .file-icon {
      width: 40px;
      height: 40px;

      border-radius: 10px;

      background: #292e35;

      display: grid;
      place-items: center;

      font-size: 18px;
    }

    .file-name {
      min-width: 0;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 13px;
    }

    /* =========================================
       COMPOSER
    ========================================= */

    .composer-wrap {
      position: absolute;

      bottom: 0;
      right: 0;
      left: 0;

      padding:
        12px
        max(14px, calc((100vw - 900px) / 2))
        18px;

      background:
        linear-gradient(
          to top,
          var(--bg) 65%,
          transparent
        );
    }

    .composer {
      max-width: 850px;

      margin: auto;

      background: #171a1f;

      border: 1px solid #30343a;

      border-radius: 18px;

      box-shadow:
        0 10px 40px rgba(0,0,0,.25);
    }

    .preview-strip {
      display: none;

      gap: 8px;

      overflow-x: auto;

      padding: 10px 10px 0;
    }

    .preview-strip.has-items {
      display: flex;
    }

    .preview {
      width: 72px;
      height: 72px;

      position: relative;

      flex-shrink: 0;

      border-radius: 10px;

      overflow: hidden;

      background: #252930;
    }

    .preview img,
    .preview video {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .preview-file {
      width: 100%;
      height: 100%;

      display: grid;
      place-items: center;

      padding: 5px;

      text-align: center;

      font-size: 10px;
    }

    .remove-preview {
      position: absolute;

      top: 4px;
      left: 4px;

      width: 20px;
      height: 20px;

      border: 0;

      border-radius: 50%;

      background: rgba(0,0,0,.75);

      color: white;

      line-height: 20px;

      padding: 0;
    }

    .composer-row {
      display: flex;

      align-items: flex-end;

      gap: 8px;

      padding: 10px;
    }

    .composer textarea {
      flex: 1;

      min-height: 42px;
      max-height: 180px;

      resize: none;

      border: 0;
      outline: none;

      background: transparent;

      color: white;

      padding: 10px;

      line-height: 1.6;
    }

    .composer textarea::placeholder {
      color: #777;
    }

    .icon-btn {
      width: 40px;
      height: 40px;

      border: 0;

      border-radius: 10px;

      background: transparent;

      color: #aaa;

      display: grid;
      place-items: center;

      font-size: 19px;

      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: #282c32;

      color: white;
    }

    .send-btn {
      width: 40px;
      height: 40px;

      border: 0;

      border-radius: 10px;

      background: var(--green);

      color: white;

      display: grid;
      place-items: center;

      font-size: 17px;

      flex-shrink: 0;

      transition: .2s;
    }

    .send-btn:hover {
      background: var(--green2);
    }

    .send-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .recording {
      background: #b91c1c !important;

      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.08);
      }
    }

    .composer-hint {
      text-align: center;

      color: #666;

      font-size: 10px;

      padding-bottom: 8px;
    }

    /* =========================================
       AUTH
    ========================================= */

    .auth-screen {
      position: fixed;

      inset: 0;

      background: #090b0d;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      z-index: 100;
    }

    .auth-screen.show {
      display: flex;
    }

    .auth-box {
      width: 100%;
      max-width: 410px;

      background: #15181c;

      border: 1px solid var(--border);

      border-radius: 20px;

      padding: 28px;

      box-shadow:
        0 25px 80px rgba(0,0,0,.4);
    }

    .auth-logo {
      width: 55px;
      height: 55px;

      border-radius: 17px;

      background: var(--green);

      display: grid;
      place-items: center;

      font-weight: 900;

      margin: 0 auto 16px;
    }

    .auth-box h2 {
      text-align: center;

      margin: 0 0 7px;
    }

    .auth-subtitle {
      text-align: center;

      color: var(--muted);

      font-size: 13px;

      margin-bottom: 22px;
    }

    .auth-input {
      width: 100%;

      padding: 13px 14px;

      margin-bottom: 10px;

      border-radius: 11px;

      border: 1px solid #30343a;

      background: #0f1114;

      color: white;

      outline: none;
    }

    .auth-input:focus {
      border-color: var(--green);
    }

    .auth-main-btn {
      width: 100%;

      padding: 13px;

      border: 0;

      border-radius: 11px;

      background: var(--green);

      color: white;

      font-weight: 700;

      margin-top: 5px;
    }

    .auth-switch {
      border: 0;

      background: transparent;

      color: var(--green);

      width: 100%;

      margin-top: 15px;
    }

    .auth-forgot {
      border: 0;

      background: transparent;

      color: #999;

      width: 100%;

      margin-top: 10px;

      font-size: 12px;
    }

    .auth-error {
      color: #f87171;

      font-size: 12px;

      margin: 10px 0;

      display: none;
    }

    /* =========================================
       MOBILE
    ========================================= */

    .overlay {
      display: none;

      position: fixed;

      inset: 0;

      background: rgba(0,0,0,.55);

      z-index: 40;
    }

    @media(max-width: 800px) {

      .sidebar {
        position: fixed;

        top: 0;
        bottom: 0;
        right: 0;

        z-index: 50;

        transform: translateX(105%);

        transition: transform .25s;

        width: 290px;

        box-shadow:
          -15px 0 50px rgba(0,0,0,.35);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .overlay.show {
        display: block;
      }

      .mobile-menu {
        display: block;
      }

      .messages {
        padding:
          25px 12px 145px;
      }

      .message-body {
        max-width: 82%;
      }

      .composer-wrap {
        padding: 10px 8px 12px;
      }

      .welcome h1 {
        font-size: 25px;
      }

      .welcome {
        min-height: 60vh;
      }

    }

    /* =========================================
       LOADING
    ========================================= */

    .typing {
      display: flex;

      align-items: center;

      gap: 5px;

      padding-top: 5px;
    }

    .typing span {
      width: 6px;
      height: 6px;

      background: #888;

      border-radius: 50%;

      animation: typing .9s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes typing {
      0%,60%,100% {
        opacity: .25;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar">

    <div class="brand">
      <div class="brand-logo">A</div>
      <div class="brand-text">Ayham AI</div>
    </div>

    <button id="newChatBtn" class="new-chat">
      ＋ محادثة جديدة
    </button>

    <div id="chatList" class="chat-list"></div>

    <div class="sidebar-bottom">

      <div class="account">

        <div id="accountAvatar" class="avatar">
          A
        </div>

        <div class="account-info">

          <div id="accountName" class="account-name">
            مستخدم
          </div>

          <div id="accountEmail" class="account-email">
            —
          </div>

        </div>

        <button id="logoutBtn" class="logout">
          ↪
        </button>

      </div>

    </div>

  </aside>

  <div id="overlay" class="overlay"></div>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">

      <button id="mobileMenu" class="mobile-menu">
        ☰
      </button>

      <div id="topTitle" class="top-title">
        محادثة جديدة
      </div>

      <div class="status">
        <span class="status-dot"></span>
        متصل
      </div>

    </header>

    <!-- MESSAGES -->
    <section id="messages" class="messages">

      <div id="messagesInner" class="messages-inner">

        <div id="welcome" class="welcome">

          <div class="welcome-logo">
            A
          </div>

          <h1>
            شلون أگدر أساعدك؟
          </h1>

          <p>
            اسألني عن أي شيء، أو أرسل صورة أو ملف أو فيديو أو تسجيل صوتي.
          </p>

        </div>

      </div>

    </section>

    <!-- COMPOSER -->
    <div class="composer-wrap">

      <div class="composer">

        <div
          id="previewStrip"
          class="preview-strip">
        </div>

        <div class="composer-row">

          <button
            id="attachBtn"
            class="icon-btn"
            title="إرفاق ملف">
            📎
          </button>

          <input
            id="fileInput"
            type="file"
            hidden
            multiple
            accept="
              image/*,
              video/*,
              audio/*,
              application/pdf,
              .doc,
              .docx,
              .txt,
              .csv,
              .md
            "
          >

          <textarea
            id="messageInput"
            rows="1"
            placeholder="اكتب رسالتك هنا..."
          ></textarea>

          <button
            id="micBtn"
            class="icon-btn"
            title="تسجيل صوتي">
            🎙️
          </button>

          <button
            id="sendBtn"
            class="send-btn"
            title="إرسال">
            ↑
          </button>

        </div>

        <div class="composer-hint">
          Ayham AI قد يخطئ أحياناً، تحقق من المعلومات المهمة.
        </div>

      </div>

    </div>

  </main>

</div>


<!-- AUTH -->
<div id="authScreen" class="auth-screen">

  <div class="auth-box">

    <div class="auth-logo">
      A
    </div>

    <h2 id="authTitle">
      تسجيل الدخول
    </h2>

    <div id="authSubtitle" class="auth-subtitle">
      ادخل لحسابك حتى تستخدم Ayham AI
    </div>

    <input
      id="authName"
      class="auth-input"
      placeholder="اسمك"
      style="display:none"
    >

    <input
      id="authEmail"
      class="auth-input"
      type="email"
      placeholder="البريد الإلكتروني"
    >

    <input
      id="authPassword"
      class="auth-input"
      type="password"
      placeholder="كلمة المرور"
    >

    <div id="authError" class="auth-error"></div>

    <button
      id="authMainBtn"
      class="auth-main-btn">
      تسجيل الدخول
    </button>

    <button
      id="authSwitch"
      class="auth-switch">
      إنشاء حساب جديد
    </button>

    <button
      id="authForgot"
      class="auth-forgot">
      نسيت كلمة المرور؟
    </button>

  </div>

</div>


<script>

  /* =========================================
     SUPABASE
  ========================================= */

  const SUPABASE_URL =
    "https://yyhykirxcsbgfddjyuti.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_ulGr0S06yyfBBzsiJqSeRQ_p3sO5dxh";

  const db =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* =========================================
     STATE
  ========================================= */

  const state = {

    user: null,

    profile: null,

    conversations: [],

    currentId: null,

    messages: [],

    pendingFiles: [],

    sending: false,

    authMode: "login",

    mediaRecorder: null,

    audioChunks: [],

    recording: false

  };


  /* =========================================
     DOM
  ========================================= */

  const $ = id =>
    document.getElementById(id);


  const messagesInner =
    $("messagesInner");

  const messageInput =
    $("messageInput");

  const sendBtn =
    $("sendBtn");

  const previewStrip =
    $("previewStrip");


  /* =========================================
     INIT
  ========================================= */

  document.addEventListener(
    "DOMContentLoaded",
    init
  );


  async function init() {

    bindEvents();

    const {
      data: {
        session
      }
    } = await db.auth.getSession();

    if (session?.user) {

      await startApp(session.user);

    } else {

      showAuth();

    }

    db.auth.onAuthStateChange(
      async (event, session) => {

        if (
          session?.user &&
          !state.user
        ) {

          await startApp(
            session.user
          );

        }

        if (
          event === "SIGNED_OUT"
        ) {

          state.user = null;

          state.profile = null;

          state.messages = [];

          state.currentId = null;

          showAuth();

        }

      }
    );

  }


  /* =========================================
     EVENTS
  ========================================= */

  function bindEvents() {

    $("newChatBtn")
      .addEventListener(
        "click",
        createNewChat
      );

    $("sendBtn")
      .addEventListener(
        "click",
        sendMessage
      );

    $("attachBtn")
      .addEventListener(
        "click",
        () =>
          $("fileInput").click()
      );

    $("fileInput")
      .addEventListener(
        "change",
        handleFiles
      );

    $("micBtn")
      .addEventListener(
        "click",
        toggleRecording
      );

    $("logoutBtn")
      .addEventListener(
        "click",
        async () => {

          await db.auth.signOut();

        }
      );

    $("mobileMenu")
      .addEventListener(
        "click",
        openSidebar
      );

    $("overlay")
      .addEventListener(
        "click",
        closeSidebar
      );

    $("authMainBtn")
      .addEventListener(
        "click",
        handleAuth
      );

    $("authSwitch")
      .addEventListener(
        "click",
        switchAuthMode
      );

    $("authForgot")
      .addEventListener(
        "click",
        resetPassword
      );

    messageInput
      .addEventListener(
        "keydown",
        e => {

          if (
            e.key === "Enter" &&
            !e.shiftKey
          ) {

            e.preventDefault();

            sendMessage();

          }

        }
      );

    messageInput
      .addEventListener(
        "input",
        autoResize
      );

    document.addEventListener(
      "dragover",
      e => e.preventDefault()
    );

    document.addEventListener(
      "drop",
      e => {

        e.preventDefault();

        if (
          e.dataTransfer?.files?.length
        ) {

          addFiles(
            Array.from(
              e.dataTransfer.files
            )
          );

        }

      }
    );

  }


  /* =========================================
     AUTH
  ========================================= */

  function showAuth() {

    $("authScreen")
      .classList
      .add("show");

  }


  function hideAuth() {

    $("authScreen")
      .classList
      .remove("show");

  }


  function setAuthError(message) {

    const el = $("authError");

    el.textContent = message;

    el.style.display =
      message ? "block" : "none";

  }


  function switchAuthMode() {

    state.authMode =
      state.authMode === "login"
        ? "signup"
        : "login";

    const signup =
      state.authMode === "signup";

    $("authTitle").textContent =
      signup
        ? "إنشاء حساب"
        : "تسجيل الدخول";

    $("authSubtitle").textContent =
      signup
        ? "أنشئ حسابك وابدأ باستخدام Ayham AI"
        : "ادخل لحسابك حتى تستخدم Ayham AI";

    $("authName").style.display =
      signup ? "block" : "none";

    $("authMainBtn").textContent =
      signup
        ? "إنشاء الحساب"
        : "تسجيل الدخول";

    $("authSwitch").textContent =
      signup
        ? "عندي حساب بالفعل"
        : "إنشاء حساب جديد";

    setAuthError("");

  }


  async function handleAuth() {

    const email =
      $("authEmail").value.trim();

    const password =
      $("authPassword").value;

    const name =
      $("authName").value.trim();

    if (!email || !password) {

      setAuthError(
        "اكتب البريد الإلكتروني وكلمة المرور."
      );

      return;

    }

    setAuthError("");

    const button =
      $("authMainBtn");

    button.disabled = true;

    try {

      if (
        state.authMode === "signup"
      ) {

        const {
          data,
          error
        } =
          await db.auth.signUp({

            email,

            password,

            options: {

              data: {

                display_name:
                  name ||
                  email.split("@")[0]

              }

            }

          });

        if (error)
          throw error;

        if (!data.session) {

          setAuthError(
            "تم إنشاء الحساب. إذا كان تأكيد البريد مفعلاً، افتح بريدك الإلكتروني."
          );

        }

      } else {

        const {
          data,
          error
        } =
          await db.auth.signInWithPassword({

            email,

            password

          });

        if (error)
          throw error;

        if (data.user) {

          await startApp(
            data.user
          );

        }

      }

    } catch (error) {

      setAuthError(
        error?.message ||
        "حدث خطأ. حاول مرة ثانية."
      );

    } finally {

      button.disabled = false;

    }

  }


  async function resetPassword() {

    const email =
      $("authEmail").value.trim();

    if (!email) {

      setAuthError(
        "اكتب بريدك الإلكتروني أولاً."
      );

      return;

    }

    const {
      error
    } =
      await db.auth.resetPasswordForEmail(
        email,
        {
          redirectTo:
            window.location.origin +
            window.location.pathname
        }
      );

    if (error) {

      setAuthError(
        error.message
      );

      return;

    }

    setAuthError(
      "تم إرسال رابط إعادة كلمة المرور إلى بريدك."
    );

  }


  /* =========================================
     APP START
  ========================================= */

  async function startApp(user) {

    state.user = user;

    hideAuth();

    await loadProfile();

    updateAccount();

    await loadConversations();

    if (
      state.conversations.length
    ) {

      await openConversation(
        state.conversations[0].id
      );

    } else {

      createNewChat();

    }

  }


  async function loadProfile() {

    const {
      data,
      error
    } =
      await db
      .from("profiles")
      .select("id, display_name")
      .eq("id", state.user.id)
      .maybeSingle();

    if (!error) {

      state.profile =
        data;

    }

  }


  function updateAccount() {

    const name =
      state.profile?.display_name ||
      state.user?.email?.split("@")[0] ||
      "مستخدم";

    $("accountName")
      .textContent = name;

    $("accountEmail")
      .textContent =
      state.user?.email || "";

    $("accountAvatar")
      .textContent =
      name
        .charAt(0)
        .toUpperCase();

  }


  /* =========================================
     CONVERSATIONS
  ========================================= */

  async function loadConversations() {

    const {
      data,
      error
    } =
      await db
      .from("conversations")
      .select(
        "id,title,messages,created_at,updated_at"
      )
      .eq(
        "user_id",
        state.user.id
      )
      .order(
        "updated_at",
        {
          ascending: false
        }
      );

    if (error) {

      console.error(error);

      return;

    }

    state.conversations =
      data || [];

    renderChatList();

  }


  function renderChatList() {

    const list =
      $("chatList");

    list.innerHTML = "";

    state.conversations
      .forEach(chat => {

        const button =
          document.createElement("button");

        button.className =
          "chat-item" +
          (
            chat.id ===
            state.currentId
              ? " active"
              : ""
          );

        button.innerHTML = `
          <span>💬</span>
          <span class="chat-title"></span>
        `;

        button
          .querySelector(".chat-title")
          .textContent =
          chat.title ||
          "محادثة جديدة";

        button.onclick =
          () => {

            openConversation(
              chat.id
            );

            closeSidebar();

          };

        list.appendChild(button);

      });

  }


  async function createNewChat() {

    state.currentId = null;

    state.messages = [];

    renderMessages();

    $("topTitle")
      .textContent =
      "محادثة جديدة";

    renderChatList();

    messageInput.focus();

    closeSidebar();

  }


  async function openConversation(id) {

    const chat =
      state.conversations
        .find(
          item => item.id === id
        );

    if (!chat)
      return;

    state.currentId = id;

    state.messages =
      Array.isArray(chat.messages)
        ? chat.messages
        : [];

    $("topTitle")
      .textContent =
      chat.title ||
      "محادثة";

    renderMessages();

    renderChatList();

  }


  async function ensureConversation() {

    if (state.currentId)
      return state.currentId;

    const firstUserMessage =
      state.messages
        .find(
          message =>
            message.role === "user"
        );

    let title =
      firstUserMessage?.content ||
      "محادثة جديدة";

    if (
      Array.isArray(title)
    ) {

      title =
        title
          .find(
            item =>
              item.type === "text"
          )
          ?.text ||
        "محادثة جديدة";

    }

    title =
      String(title)
        .replace(/\s+/g, " ")
        .slice(0, 45);

    const {
      data,
      error
    } =
      await db
      .from("conversations")
      .insert({

        user_id:
          state.user.id,

        title:

          title ||
          "محادثة جديدة",

        messages:
          state.messages

      })
      .select()
      .single();

    if (error)
      throw error;

    state.currentId =
      data.id;

    state.conversations.unshift(
      data
    );

    return data.id;

  }


  async function saveConversation() {

    if (!state.currentId)
      return;

    const {
      error
    } =
      await db
      .from("conversations")
      .update({

        messages:
          state.messages,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        state.currentId
      )
      .eq(
        "user_id",
        state.user.id
      );

    if (error)
      console.error(error);

    await loadConversations();

  }


  /* =========================================
     FILES
  ========================================= */

  function handleFiles(event) {

    const files =
      Array.from(
        event.target.files || []
      );

    addFiles(files);

    event.target.value = "";

  }


  function addFiles(files) {

    for (const file of files) {

      const error =
        validateFile(file);

      if (error) {

        alert(error);

        continue;

      }

      if (
        state.pendingFiles.length >= 5
      ) {

        alert(
          "تگدر ترسل 5 ملفات كحد أقصى بالرسالة."
        );

        break;

      }

      state.pendingFiles.push(file);

    }

    renderPreviews();

  }


  function validateFile(file) {

    const maxImage =
      10 * 1024 * 1024;

    const maxAudio =
      25 * 1024 * 1024;

    const maxVideo =
      50 * 1024 * 1024;

    const maxFile =
      20 * 1024 * 1024;

    if (file.type.startsWith("image/")) {

      if (file.size > maxImage)
        return "الصورة أكبر من 10MB.";

      return null;

    }

    if (file.type.startsWith("video/")) {

      if (file.size > maxVideo)
        return "الفيديو أكبر من 50MB.";

      return null;

    }

    if (file.type.startsWith("audio/")) {

      if (file.size > maxAudio)
        return "الصوت أكبر من 25MB.";

      return null;

    }

    if (
      file.type === "application/pdf" ||
      /\.(doc|docx|txt|csv|md)$/i.test(
        file.name
      )
    ) {

      if (file.size > maxFile)
        return "الملف أكبر من 20MB.";

      return null;

    }

    return "نوع الملف غير مدعوم.";

  }


  function renderPreviews() {

    previewStrip.innerHTML = "";

    if (
      !state.pendingFiles.length
    ) {

      previewStrip
        .classList
        .remove("has-items");

      return;

    }

    previewStrip
      .classList
      .add("has-items");

    state.pendingFiles
      .forEach(
        (file, index) => {

          const box =
            document.createElement("div");

          box.className =
            "preview";

          const remove =
            document.createElement("button");

          remove.className =
            "remove-preview";

          remove.textContent =
            "×";

          remove.onclick =
            () => {

              state.pendingFiles
                .splice(index, 1);

              renderPreviews();

            };

          if (
            file.type.startsWith(
              "image/"
            )
          ) {

            const img =
              document.createElement("img");

            img.src =
              URL.createObjectURL(
                file
              );

            box.appendChild(img);

          } else if (
            file.type.startsWith(
              "video/"
            )
          ) {

            const video =
              document.createElement(
                "video"
              );

            video.src =
              URL.createObjectURL(
                file
              );

            video.muted = true;

            box.appendChild(video);

          } else {

            const div =
              document.createElement("div");

            div.className =
              "preview-file";

            div.textContent =
              file.name;

            box.appendChild(div);

          }

          box.appendChild(remove);

          previewStrip.appendChild(
            box
          );

        }
      );

  }


  async function uploadFile(file) {

    const safeName =
      file.name
        .replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        )
        .slice(-100);

    const path =
      `${state.user.id}/${crypto.randomUUID()}-${safeName}`;

    const {
      error
    } =
      await db
      .storage
      .from("chat-files")
      .upload(
        path,
        file,
        {
          cacheControl: "3600",
          upsert: false,
          contentType:
            file.type ||
            "application/octet-stream"
        }
      );

    if (error)
      throw error;

    return {

      path,

      name:
        file.name,

      type:
        file.type ||
        "application/octet-stream",

      size:
        file.size

    };

  }


  async function getSignedUrl(path) {

    const {
      data,
      error
    } =
      await db
      .storage
      .from("chat-files")
      .createSignedUrl(
        path,
        3600
      );

    if (error)
      throw error;

    return data.signedUrl;

  }


  /* =========================================
     SEND
  ========================================= */

  async function sendMessage() {

    if (state.sending)
      return;

    const text =
      messageInput.value.trim();

    if (
      !text &&
      !state.pendingFiles.length
    ) {

      return;

    }

    state.sending = true;

    sendBtn.disabled = true;

    try {

      const uploaded = [];

      for (
        const file
        of state.pendingFiles
      ) {

        const meta =
          await uploadFile(file);

        uploaded.push(meta);

      }

      const attachments = [];

      for (
        const item
        of uploaded
      ) {

        attachments.push({

          ...item,

          url:
            await getSignedUrl(
              item.path
            )

        });

      }

      const userMessage = {

        role: "user",

        content:
          text,

        attachments,

        created_at:
          new Date().toISOString()

      };

      state.messages.push(
        userMessage
      );

      messageInput.value = "";

      state.pendingFiles = [];

      renderPreviews();

      renderMessages();

      await ensureConversation();

      await saveConversation();

      showTyping();

      const reply =
        await callAIChat(
          text,
          attachments
        );

      removeTyping();

      state.messages.push({

        role: "assistant",

        content:
          reply,

        created_at:
          new Date().toISOString()

      });

      renderMessages();

      await saveConversation();

    } catch (error) {

      console.error(error);

      removeTyping();

      state.messages.push({

        role: "assistant",

        content:
          "صار خطأ أثناء الإرسال. تأكد من الملف أو جرّب مرة ثانية."

      });

      renderMessages();

    } finally {

      state.sending = false;

      sendBtn.disabled = false;

    }

  }


  /* =========================================
     AI
  ========================================= */

  async function callAIChat(
    text,
    attachments
  ) {

    const cleanMessages =
      state.messages
        .slice(-20)
        .map(
          message => ({

            role:
              message.role,

            content:
              message.content || "",

            attachments:
              message.attachments || []

          })
        );

    const {
      data,
      error
    } =
      await db.functions.invoke(
        "ai-chat",
        {
          body: {

            message:
              text,

            messages:
              cleanMessages,

            attachments

          }
        }
      );

    if (error) {

      console.error(
        "Edge Function:",
        error
      );

      throw new Error(
        error.message ||
        "AI error"
      );

    }

    if (
      !data ||
      typeof data.reply !== "string"
    ) {

      throw new Error(
        data?.error ||
        "لم يرجع الذكاء الاصطناعي جواباً."
      );

    }

    return data.reply;

  }


  /* =========================================
     RENDER MESSAGES
  ========================================= */

  function renderMessages() {

    messagesInner.innerHTML = "";

    if (!state.messages.length) {

      messagesInner.innerHTML = `

        <div id="welcome" class="welcome">

          <div class="welcome-logo">
            A
          </div>

          <h1>
            شلون أگدر أساعدك؟
          </h1>

          <p>
            اسألني عن أي شيء، أو أرسل صورة أو ملف أو فيديو أو تسجيل صوتي.
          </p>

        </div>

      `;

      return;

    }

    state.messages
      .forEach(
        (message, index) => {

          renderMessage(
            message,
            index
          );

        }
      );

    scrollBottom();

  }


  function renderMessage(
    message,
    index
  ) {

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message " +
      (
        message.role === "user"
          ? "user"
          : "assistant"
      );

    const avatar =
      document.createElement("div");

    avatar.className =
      "message-avatar";

    avatar.textContent =
      message.role === "user"
        ? "أ"
        : "A";

    const body =
      document.createElement("div");

    body.className =
      "message-body";

    const name =
      document.createElement("div");

    name.className =
      "message-name";

    name.textContent =
      message.role === "user"
        ? "أنت"
        : "Ayham AI";

    const content =
      document.createElement("div");

    content.className =
      "message-content";

    content.textContent =
      message.content || "";

    body.appendChild(name);

    if (
      message.attachments?.length
    ) {

      const grid =
        document.createElement("div");

      grid.className =
        "attachment-grid";

      message.attachments
        .forEach(
          attachment => {

            renderAttachment(
              grid,
              attachment
            );

          }
        );

      body.appendChild(grid);

    }

    body.appendChild(content);

    if (
      message.role ===
      "assistant"
    ) {

      const actions =
        document.createElement("div");

      actions.className =
        "assistant-actions";

      const copy =
        document.createElement("button");

      copy.textContent =
        "نسخ";

      copy.onclick =
        async () => {

          await navigator.clipboard.writeText(
            message.content || ""
          );

          copy.textContent =
            "تم النسخ ✓";

          setTimeout(
            () =>
              copy.textContent =
              "نسخ",
            1200
          );

        };

      actions.appendChild(copy);

      body.appendChild(actions);

    }

    wrapper.appendChild(avatar);

    wrapper.appendChild(body);

    messagesInner.appendChild(
      wrapper
    );

  }


  function renderAttachment(
    container,
    attachment
  ) {

    const card =
      document.createElement("div");

    card.className =
      "attachment-card";

    const type =
      attachment.type || "";

    const url =
      attachment.url;

    if (
      type.startsWith("image/")
    ) {

      const img =
        document.createElement("img");

      img.src = url;

      img.alt =
        attachment.name;

      card.appendChild(img);

    } else if (
      type.startsWith("video/")
    ) {

      const video =
        document.createElement("video");

      video.src = url;

      video.controls = true;

      card.appendChild(video);

    } else if (
      type.startsWith("audio/")
    ) {

      const audio =
        document.createElement("audio");

      audio.src = url;

      audio.controls = true;

      card.appendChild(audio);

    } else {

      const link =
        document.createElement("a");

      link.href = url;

      link.target = "_blank";

      link.style.textDecoration =
        "none";

      link.style.color =
        "white";

      link.innerHTML = `

        <div class="file-card">

          <div class="file-icon">
            📄
          </div>

          <div class="file-name"></div>

        </div>

      `;

      link
        .querySelector(".file-name")
        .textContent =
        attachment.name;

      card.appendChild(link);

    }

    container.appendChild(card);

  }

  /* =========================================
     AUDIO RECORDING
  ========================================= */

  async function toggleRecording() {

    if (state.recording) {

      stopRecording();

      return;

    }

    try {

      const stream =
        await navigator.mediaDevices
          .getUserMedia({
            audio: true
          });

      const recorder =
        new MediaRecorder(
          stream
        );

      state.mediaRecorder =
        recorder;

      state.audioChunks = [];

      recorder.ondataavailable =
        event => {

          if (
            event.data.size
          ) {

            state.audioChunks.push(
              event.data
            );

          }

        };

      recorder.onstop =
        async () => {

          stream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );

          const blob =
            new Blob(
              state.audioChunks,
              {
                type:
                  recorder.mimeType ||
                  "audio/webm"
              }
            );

          const extension =
            recorder.mimeType
              ?.includes("ogg")
              ? "ogg"
              : "webm";

          const file =
            new File(
              [blob],
              `voice-${Date.now()}.${extension}`,
              {
                type:
                  blob.type
              }
            );

          addFiles([file]);

        };

      recorder.start();

      state.recording = true;

      $("micBtn")
        .classList
        .add("recording");

      $("micBtn")
        .textContent = "⏹️";

    } catch (error) {

      console.error(error);

      alert(
        "ما گدرت أوصل للمايكروفون. تأكد من صلاحية المايك."
      );

    }

  }


  function stopRecording() {

    if (
      state.mediaRecorder &&
      state.recording
    ) {

      state.mediaRecorder.stop();

    }

    state.recording = false;

    $("micBtn")
      .classList
      .remove("recording");

    $("micBtn")
      .textContent = "🎙️";

  }


  /* =========================================
     UI
  ========================================= */

  function autoResize() {

    messageInput.style.height =
      "auto";

    messageInput.style.height =
      Math.min(
        messageInput.scrollHeight,
        180
      ) + "px";

  }


  function openSidebar() {

    $("sidebar")
      .classList
      .add("open");

    $("overlay")
      .classList
      .add("show");

  }


  function closeSidebar() {

    $("sidebar")
      .classList
      .remove("open");

    $("overlay")
      .classList
      .remove("show");

  }

</script>

</body>
</html>
