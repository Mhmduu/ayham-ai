<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Ayham AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #080808;
      --panel: #111111;
      --panel2: #171717;
      --panel3: #202020;
      --border: #292929;
      --text: #f5f5f5;
      --muted: #9b9b9b;
      --white: #ffffff;
      --danger: #ff7272;
      --user: #252525;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    body {
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       AUTH
    ========================= */

    #authScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(
          circle at top,
          #171717 0,
          #080808 55%
        );
      overflow-y: auto;
    }

    .auth-card {
      width: 100%;
      max-width: 470px;
      background: #111114;
      border: 1px solid #29292e;
      border-radius: 28px;
      padding: 34px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
    }

    .logo-box {
      width: 82px;
      height: 82px;
      margin: 0 auto 20px;
      border-radius: 24px;
      background: #fff;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 900;
    }

    .auth-title {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .auth-subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 9px;
      font-size: 15px;
      color: #ddd;
    }

    .field input {
      width: 100%;
      height: 58px;
      border-radius: 16px;
      border: 1px solid #333;
      outline: none;
      background: #f0f3fb;
      color: #111;
      padding: 0 17px;
      font-size: 17px;
      direction: ltr;
      text-align: left;
    }

    .field input:focus {
      border-color: #777;
    }

    .auth-button {
      width: 100%;
      height: 58px;
      border: 0;
      border-radius: 16px;
      background: #fff;
      color: #111;
      font-size: 18px;
      font-weight: 800;
      margin-top: 4px;
    }

    .auth-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .auth-secondary {
      width: 100%;
      height: 58px;
      margin-top: 12px;
      border-radius: 16px;
      border: 1px solid #303030;
      background: transparent;
      color: #eee;
    }

    .auth-link {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #bbb;
      text-decoration: none;
      cursor: pointer;
    }

    .auth-link:hover {
      color: #fff;
    }

    .auth-error {
      background: rgba(255, 70, 70, 0.11);
      border: 1px solid rgba(255, 90, 90, 0.35);
      color: #ff8b8b;
      padding: 13px 15px;
      border-radius: 14px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.6;
    }

    /* =========================
       APP
    ========================= */

    #app {
      width: 100%;
      height: 100dvh;
      display: flex;
      background: var(--bg);
    }

    .sidebar {
      width: 280px;
      flex-shrink: 0;
      height: 100%;
      background: #0d0d0d;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 14px;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 8px 18px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #fff;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
    }

    .new-chat {
      width: 100%;
      height: 48px;
      border: 1px solid #303030;
      background: #181818;
      color: #fff;
      border-radius: 14px;
      margin-bottom: 15px;
      font-weight: 700;
    }

    .new-chat:hover {
      background: #222;
    }

    .conversation-title {
      color: #777;
      font-size: 12px;
      padding: 8px 8px;
    }

    #conversationList {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .conversation-item {
      position: relative;
      width: 100%;
      min-height: 45px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 11px;
      margin-bottom: 4px;
      border-radius: 11px;
      border: 1px solid transparent;
      background: transparent;
      color: #ddd;
      text-align: right;
    }

    .conversation-item:hover {
      background: #181818;
    }

    .conversation-item.active {
      background: #202020;
      border-color: #292929;
    }

    .conversation-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 14px;
    }

    .delete-conversation {
      width: 27px;
      height: 27px;
      flex-shrink: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #777;
      opacity: 0;
    }

    .conversation-item:hover .delete-conversation {
      opacity: 1;
    }

    .delete-conversation:hover {
      color: #ff7777;
      background: #292020;
    }

    .account {
      border-top: 1px solid #252525;
      padding-top: 12px;
    }

    .account-email {
      color: #999;
      font-size: 12px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      margin-bottom: 10px;
      padding: 0 5px;
      direction: ltr;
      text-align: right;
    }

    .logout {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      border: 1px solid #303030;
      background: transparent;
      color: #ddd;
    }

    .logout:hover {
      background: #1c1c1c;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 58px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #191919;
      background: rgba(8, 8, 8, 0.92);
      backdrop-filter: blur(15px);
    }

    .mobile-menu {
      position: absolute;
      right: 12px;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: #fff;
      font-size: 23px;
      display: none;
    }

    .top-title {
      font-size: 15px;
      font-weight: 700;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 35px 20px 170px;
    }

    .messages-inner {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
    }

    .welcome {
      min-height: calc(100dvh - 220px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
    }

    .welcome-logo {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: #fff;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 26px;
      margin-bottom: 20px;
    }

    .welcome h1 {
      margin: 0 0 10px;
      font-size: 31px;
    }

    .welcome p {
      margin: 0;
      color: #888;
      font-size: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      line-height: 1.8;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.assistant {
      justify-content: flex-start;
    }

    .avatar {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      background: #fff;
      color: #111;
    }

    .user .avatar {
      background: #303030;
      color: #fff;
    }

    .message-content {
      max-width: calc(100% - 50px);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 16px;
    }

    .user .message-content {
      background: var(--user);
      padding: 10px 15px;
      border-radius: 17px;
    }

    .assistant .message-content {
      padding-top: 2px;
    }

    .typing {
      display: flex;
      gap: 5px;
      padding-top: 9px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #888;
      animation: typing 1.1s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        opacity: 0.3;
        transform: translateY(0);
      }
      30% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer-area {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 15px 20px 20px;
      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(8, 8, 8, 0.94) 28%,
          #080808 50%
        );
    }

    .composer {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      position: relative;
    }

    .composer-box {
      min-height: 60px;
      border: 1px solid #353535;
      background: #171719;
      border-radius: 20px;
      display: flex;
      align-items: flex-end;
      padding: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,.25);
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      max-height: 180px;
      min-height: 43px;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: #fff;
      padding: 10px 12px;
      line-height: 1.6;
      font-size: 16px;
      direction: rtl;
    }

    #messageInput::placeholder {
      color: #777;
    }

    #sendButton {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border: 0;
      border-radius: 14px;
      background: #fff;
      color: #111;
      font-size: 22px;
      font-weight: 900;
    }

    #sendButton:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .composer-note {
      text-align: center;
      color: #555;
      font-size: 11px;
      margin-top: 8px;
    }

    /* =========================
       TOAST
    ========================= */

    #toast {
      position: fixed;
      left: 50%;
      bottom: 95px;
      transform: translateX(-50%) translateY(15px);
      max-width: calc(100% - 30px);
      background: #242424;
      color: #fff;
      border: 1px solid #383838;
      border-radius: 13px;
      padding: 12px 16px;
      font-size: 14px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s;
      text-align: center;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast.error {
      border-color: #693838;
      color: #ffadad;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 760px) {
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        right: 0;
        width: min(290px, 86vw);
        transform: translateX(105%);
        transition: transform 0.25s ease;
        box-shadow: -20px 0 50px rgba(0,0,0,.4);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .mobile-menu {
        display: block;
      }

      .top-title {
        font-size: 14px;
      }

      .messages {
        padding: 25px 13px 155px;
      }

      .message {
        gap: 9px;
        margin-bottom: 23px;
      }

      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        font-size: 11px;
      }

      .message-content {
        max-width: calc(100% - 40px);
        font-size: 15px;
      }

      .composer-area {
        padding: 10px 10px 13px;
      }

      .composer-box {
        border-radius: 18px;
      }

      .welcome h1 {
        font-size: 27px;
      }

      .auth-card {
        padding: 25px 18px;
        border-radius: 23px;
      }

      .auth-title {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       AUTH SCREEN
  ========================= -->

  <section id="authScreen">

    <div class="auth-card">

      <div class="logo-box">AI</div>

      <div id="authTitle" class="auth-title">
        تسجيل الدخول
      </div>

      <div id="authSubtitle" class="auth-subtitle">
        سجّل دخولك حتى تستخدم Ayham AI
      </div>

      <div id="authError" class="auth-error hidden"></div>

      <div id="nameField" class="field hidden">
        <label>الاسم</label>
        <input
          id="nameInput"
          type="text"
          placeholder="اسمك"
          autocomplete="name"
        />
      </div>

      <div class="field">
        <label>البريد الإلكتروني</label>
        <input
          id="emailInput"
          type="email"
          placeholder="example@gmail.com"
          autocomplete="email"
        />
      </div>

      <div id="passwordField" class="field">
        <label>كلمة المرور</label>
        <input
          id="passwordInput"
          type="password"
          placeholder="كلمة المرور"
          autocomplete="current-password"
        />
      </div>

      <button id="authButton" class="auth-button">
        تسجيل الدخول
      </button>

      <button
        id="forgotButton"
        class="auth-secondary"
      >
        نسيت كلمة المرور؟
      </button>

      <a
        id="switchAuth"
        class="auth-link"
      >
        إنشاء حساب جديد
      </a>

    </div>

  </section>


  <!-- =========================
       APP
  ========================= -->

  <section id="app" class="hidden">

    <aside id="sidebar" class="sidebar">

      <div class="brand">
        <div class="brand-icon">AI</div>
        <div class="brand-name">Ayham AI</div>
      </div>

      <button
        id="newChatButton"
        class="new-chat"
      >
        ＋ محادثة جديدة
      </button>

      <div class="conversation-title">
        محادثاتك
      </div>

      <div id="conversationList"></div>

      <div class="account">

        <div
          id="accountEmail"
          class="account-email"
        ></div>

        <button
          id="logoutButton"
          class="logout"
        >
          تسجيل الخروج
        </button>

      </div>

    </aside>


    <main class="main">

      <header class="topbar">

        <button
          id="mobileMenu"
          class="mobile-menu"
        >
          ☰
        </button>

        <div
          id="topTitle"
          class="top-title"
        >
          محادثة جديدة
        </div>

      </header>


      <div
        id="messages"
        class="messages"
      >

        <div
          id="messagesInner"
          class="messages-inner"
        ></div>

      </div>


      <div class="composer-area">

        <div class="composer">

          <div class="composer-box">

            <textarea
              id="messageInput"
              rows="1"
              placeholder="اكتب رسالتك..."
              autocomplete="off"
            ></textarea>

            <button
              id="sendButton"
              title="إرسال"
            >
              ↑
            </button>

          </div>

          <div class="composer-note">
            Ayham AI قد يخطئ أحياناً، تحقق من المعلومات المهمة.
          </div>

        </div>

      </div>

    </main>

  </section>


  <div id="toast"></div>


<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://yyhykirxcsbgfddjyuti.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_ulGr0S06yyfBBzsiJqSeRQ_p3sO5dxh";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );


/* =========================================================
   STATE
========================================================= */

const state = {
  user: null,
  session: null,
  conversations: [],
  currentId: null,
  messages: [],
  authMode: "login",
  sending: false
};


/* =========================================================
   HELPERS
========================================================= */

const $ = (id) =>
  document.getElementById(id);


function showToast(message, error = false) {

  const toast = $("toast");

  toast.textContent = message;

  toast.className =
    "show" + (error ? " error" : "");

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(() => {
      toast.className = "";
    }, 3500);
}


function showAuthError(message) {

  const box = $("authError");

  box.textContent = message;

  box.classList.remove("hidden");
}


function clearAuthError() {

  $("authError").classList.add("hidden");
  $("authError").textContent = "";
}


function translateError(error) {

  const message =
    error?.message ||
    error?.error_description ||
    String(error || "");

  if (!message) {
    return "صار خطأ غير معروف.";
  }

  if (
    message.toLowerCase().includes("invalid api key")
  ) {
    return "مفتاح Supabase غير صالح أو لا يطابق رابط المشروع. تأكد من SUPABASE_URL و Publishable Key.";
  }

  if (
    message.toLowerCase().includes("invalid login credentials")
  ) {
    return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
  }

  if (
    message.toLowerCase().includes("email not confirmed")
  ) {
    return "لازم تأكد بريدك الإلكتروني أولاً.";
  }

  if (
    message.toLowerCase().includes("user already registered")
  ) {
    return "هذا البريد مسجل مسبقاً. جرّب تسجيل الدخول.";
  }

  if (
    message.toLowerCase().includes("password should be at least")
  ) {
    return "كلمة المرور لازم تكون أطول.";
  }

  if (
    message.toLowerCase().includes("failed to send a request")
  ) {
    return "تعذّر الاتصال بـ Edge Function. تأكد أن ai-chat منشورة وأن اسمها صحيح.";
  }

  return message;
}


/* =========================================================
   AUTH UI
========================================================= */

function updateAuthUI() {

  const register =
    state.authMode === "register";

  $("authTitle").textContent =
    register
      ? "إنشاء حساب"
      : "تسجيل الدخول";

  $("authSubtitle").textContent =
    register
      ? "أنشئ حسابك وابدأ استخدام Ayham AI"
      : "سجّل دخولك حتى تستخدم Ayham AI";

  $("authButton").textContent =
    register
      ? "إنشاء الحساب"
      : "تسجيل الدخول";

  $("nameField").classList.toggle(
    "hidden",
    !register
  );

  $("forgotButton").classList.toggle(
    "hidden",
    register
  );

  $("passwordInput").autocomplete =
    register
      ? "new-password"
      : "current-password";

  $("switchAuth").textContent =
    register
      ? "عندي حساب بالفعل"
      : "إنشاء حساب جديد";
}


$("switchAuth").addEventListener(
  "click",
  () => {

    state.authMode =
      state.authMode === "login"
        ? "register"
        : "login";

    clearAuthError();

    updateAuthUI();
  }
);


/* =========================================================
   LOGIN / REGISTER
========================================================= */

$("authButton").addEventListener(
  "click",
  handleAuth
);


$("passwordInput").addEventListener(
  "keydown",
  (event) => {

    if (event.key === "Enter") {
      handleAuth();
    }

  }
);


$("emailInput").addEventListener(
  "keydown",
  (event) => {

    if (event.key === "Enter") {
      handleAuth();
    }

  }
);


async function handleAuth() {

  clearAuthError();

  const email =
    $("emailInput").value.trim();

  const password =
    $("passwordInput").value;

  const name =
    $("nameInput").value.trim();

  if (!email) {
    showAuthError(
      "اكتب البريد الإلكتروني."
    );
    return;
  }

  if (!password) {
    showAuthError(
      "اكتب كلمة المرور."
    );
    return;
  }

  if (
    state.authMode === "register" &&
    !name
  ) {
    showAuthError(
      "اكتب اسمك."
    );
    return;
  }

  const button =
    $("authButton");

  button.disabled = true;

  button.textContent =
    state.authMode === "register"
      ? "جاري إنشاء الحساب..."
      : "جاري تسجيل الدخول...";

  try {

    if (state.authMode === "register") {

      const {
        data,
        error
      } = await db.auth.signUp({
        email,
        password,
        options: {
          data: {
            display_name: name
          }
        }
      });

      if (error) {
        throw error;
      }

      if (
        data.user &&
        !data.session
      ) {

        showAuthError(
          "تم إنشاء الحساب. افتح بريدك الإلكتروني واضغط رابط التأكيد، وبعدها سجّل الدخول."
        );

        return;
      }

      showToast(
        "تم إنشاء الحساب بنجاح."
      );

    } else {

      const {
        data,
        error
      } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        throw error;
      }

      if (!data.session) {
        throw new Error(
          "لم يتم إنشاء جلسة تسجيل الدخول."
        );
      }

      showToast(
        "تم تسجيل الدخول."
      );
    }

  } catch (error) {

    console.error("Auth error:", error);

    showAuthError(
      translateError(error)
    );

  } finally {

    button.disabled = false;

    updateAuthUI();
  }
}


/* =========================================================
   FORGOT PASSWORD
========================================================= */

$("forgotButton").addEventListener(
  "click",
  async () => {

    clearAuthError();

    const email =
      $("emailInput").value.trim();

    if (!email) {
      showAuthError(
        "اكتب بريدك الإلكتروني أولاً."
      );
      return;
    }

    try {

      const {
        error
      } = await db.auth.resetPasswordForEmail(
        email,
        {
          redirectTo:
            window.location.origin
        }
      );

      if (error) {
        throw error;
      }

      showToast(
        "إذا كان البريد مسجلاً، راح توصلك رسالة لإعادة كلمة المرور."
      );

    } catch (error) {

      console.error(error);

      showAuthError(
        translateError(error)
      );
    }
  }
);


/* =========================================================
   SESSION
========================================================= */

async function initialize() {

  const {
    data,
    error
  } = await db.auth.getSession();

  if (error) {
    console.error(error);
  }

  if (data?.session) {

    await initializeUser(
      data.session
    );

  } else {

    showAuth();

  }
}


db.auth.onAuthStateChange(
  async (event, session) => {

    if (
      session &&
      (
        event === "SIGNED_IN" ||
        event === "INITIAL_SESSION" ||
        event === "TOKEN_REFRESHED"
      )
    ) {

      state.session = session;
      state.user = session.user;

      await initializeUser(
        session
      );

    }

    if (
      event === "SIGNED_OUT"
    ) {

      state.session = null;
      state.user = null;
      state.conversations = [];
      state.currentId = null;
      state.messages = [];

      showAuth();
    }
  }
);


async function initializeUser(session) {

  state.session = session;
  state.user = session.user;

  $("accountEmail").textContent =
    state.user.email || "";

  $("authScreen").classList.add(
    "hidden"
  );

  $("app").classList.remove(
    "hidden"
  );

  await ensureProfile();

  await loadConversations();

  if (state.conversations.length) {

    await openConversation(
      state.conversations[0].id
    );

  } else {

    createNewConversationUI();
  }
}


function showAuth() {

  $("app").classList.add(
    "hidden"
  );

  $("authScreen").classList.remove(
    "hidden"
  );

  updateAuthUI();
}


/* =========================================================
   PROFILE
========================================================= */

async function ensureProfile() {

  if (!state.user) {
    return;
  }

  try {

    const {
      data,
      error
    } = await db
      .from("profiles")
      .select("id, display_name")
      .eq("id", state.user.id)
      .maybeSingle();

    if (error) {
      console.error(
        "Profile select:",
        error
      );
      return;
    }

    if (!data) {

      const displayName =
        state.user.user_metadata?.display_name ||
        state.user.email?.split("@")[0] ||
        "مستخدم";

      const {
        error: insertError
      } = await db
        .from("profiles")
        .insert({
          id: state.user.id,
          display_name: displayName
        });

      if (insertError) {
        console.error(
          "Profile insert:",
          insertError
        );
      }
    }

  } catch (error) {

    console.error(
      "Profile error:",
      error
    );
  }
}


/* =========================================================
   CONVERSATIONS
========================================================= */

async function loadConversations() {

  if (!state.user) {
    return;
  }

  const {
    data,
    error
  } = await db
    .from("conversations")
    .select(
      "id, user_id, title, messages, created_at, updated_at"
    )
    .eq(
      "user_id",
      state.user.id
    )
    .order(
      "updated_at",
      {
        ascending: false
      }
    );

  if (error) {

    console.error(
      "Load conversations:",
      error
    );

    showToast(
      "تعذّر تحميل المحادثات.",
      true
    );

    return;
  }

  state.conversations =
    data || [];

  renderConversationList();
}


function renderConversationList() {

  const list =
    $("conversationList");

  list.innerHTML = "";

  if (!state.conversations.length) {

    const empty =
      document.createElement("div");

    empty.style.cssText =
      "padding:15px 8px;color:#666;font-size:13px";

    empty.textContent =
      "ما عندك محادثات بعد.";

    list.appendChild(empty);

    return;
  }

  state.conversations.forEach(
    (conversation) => {

      const item =
        document.createElement("div");

      item.className =
        "conversation-item" +
        (
          conversation.id ===
          state.currentId
            ? " active"
            : ""
        );

      const name =
        document.createElement("div");

      name.className =
        "conversation-name";

      name.textContent =
        conversation.title ||
        "محادثة جديدة";

      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete-conversation";

      deleteButton.textContent =
        "×";

      deleteButton.title =
        "حذف المحادثة";

      deleteButton.addEventListener(
        "click",
        async (event) => {

          event.stopPropagation();

          await deleteConversation(
            conversation.id
          );
        }
      );

      item.appendChild(name);
      item.appendChild(deleteButton);

      item.addEventListener(
        "click",
        async () => {

          await openConversation(
            conversation.id
          );

          closeMobileSidebar();
        }
      );

      list.appendChild(item);
    }
  );
}


async function openConversation(id) {

  const conversation =
    state.conversations.find(
      (item) => item.id === id
    );

  if (!conversation) {
    return;
  }

  state.currentId =
    conversation.id;

  state.messages =
    Array.isArray(conversation.messages)
      ? conversation.messages
      : [];

  $("topTitle").textContent =
    conversation.title ||
    "محادثة جديدة";

  renderConversationList();
  renderMessages();
}


function createNewConversationUI() {

  state.currentId = null;
  state.messages = [];

  $("topTitle").textContent =
    "محادثة جديدة";

  renderConversationList();
  renderMessages();

  setTimeout(() => {
    $("messageInput").focus();
  }, 100);
}


$("newChatButton").addEventListener(
  "click",
  () => {

    createNewConversationUI();

    closeMobileSidebar();
  }
);


async function createConversation(
  firstMessage
) {

  const title =
    firstMessage
      .trim()
      .replace(/\s+/g, " ")
      .slice(0, 55) ||
    "محادثة جديدة";

  const {
    data,
    error
  } = await db
    .from("conversations")
    .insert({
      user_id: state.user.id,
      title,
      messages: []
    })
    .select()
    .single();

  if (error) {
    throw error;
  }

  state.conversations.unshift(
    data
  );

  state.currentId =
    data.id;

  renderConversationList();

  return data;
}


async function saveCurrentConversation() {

  if (
    !state.user ||
    !state.currentId
  ) {
    return;
  }

  const {
    error
  } = await db
    .from("conversations")
    .update({
      messages: state.messages,
      updated_at: new Date().toISOString()
    })
    .eq(
      "id",
      state.currentId
    )
    .eq(
      "user_id",
      state.user.id
    );

  if (error) {

    console.error(
      "Save conversation:",
      error
    );

    throw error;
  }

  const item =
    state.conversations.find(
      (conversation) =>
        conversation.id ===
        state.currentId
    );

  if (item) {

    item.messages =
      state.messages;

    item.updated_at =
      new Date().toISOString();
  }

  state.conversations.sort(
    (a, b) =>
      new Date(b.updated_at) -
      new Date(a.updated_at)
  );

  renderConversationList();
}


async function deleteConversation(id) {

  if (!state.user) {
    return;
  }

  const confirmed =
    confirm(
      "متأكد تريد حذف هاي المحادثة؟"
    );

  if (!confirmed) {
    return;
  }

  const {
    error
  } = await db
    .from("conversations")
    .delete()
    .eq(
      "id",
      id
    )
    .eq(
      "user_id",
      state.user.id
    );

  if (error) {

    console.error(error);

    showToast(
      "تعذّر حذف المحادثة.",
      true
    );

    return;
  }

  state.conversations =
    state.conversations.filter(
      (conversation) =>
        conversation.id !== id
    );

  if (state.currentId === id) {

    if (state.conversations.length) {

      await openConversation(
        state.conversations[0].id
      );

    } else {

      createNewConversationUI();
    }
  }

  renderConversationList();

  showToast(
    "تم حذف المحادثة."
  );
}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages() {

  const container =
    $("messagesInner");

  container.innerHTML = "";

  if (!state.messages.length) {

    const welcome =
      document.createElement("div");

    welcome.className =
      "welcome";

    welcome.innerHTML = `
      <div class="welcome-logo">AI</div>
      <h1>شلون أگدر أساعدك؟</h1>
      <p>اسألني أي سؤال وراح أحاول أساعدك.</p>
    `;

    container.appendChild(
      welcome
    );

    return;
  }

  state.messages.forEach(
    (message) => {

      addMessageToDOM(
        message.role,
        message.content
      );
    }
  );

  scrollToBottom();
}


function addMessageToDOM(
  role,
  content
) {

  const container =
    $("messagesInner");

  const message =
    document.createElement("div");

  message.className =
    "message " +
    (
      role === "user"
        ? "user"
        : "assistant"
    );

  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar";

  avatar.textContent =
    role === "user"
      ? "أنت"
      : "AI";

  const body =
    document.createElement("div");

  body.className =
    "message-content";

  body.textContent =
    content;

  message.appendChild(
    avatar
  );

  message.appendChild(
    body
  );

  container.appendChild(
    message
  );
}


function addTyping() {

  const container =
    $("messagesInner");

  const message =
    document.createElement("div");

  message.className =
    "message assistant";

  message.id =
    "typingMessage";

  message.innerHTML = `
    <div class="avatar">AI</div>
    <div class="message-content">
      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  `;

  container.appendChild(
    message
  );

  scrollToBottom();
}


function removeTyping() {

  const typing =
    $("typingMessage");

  if (typing) {
    typing.remove();
  }
}


function scrollToBottom() {

  const box =
    $("messages");

  requestAnimationFrame(
    () => {
      box.scrollTop =
        box.scrollHeight;
    }
  );
}


/* =========================================================
   AI CHAT
========================================================= */

async function callAIChat() {

  if (!state.user) {
    throw new Error(
      "لازم تسجل الدخول أولاً."
    );
  }

  const {
    data: sessionData,
    error: sessionError
  } = await db.auth.getSession();

  if (sessionError) {
    throw sessionError;
  }

  const session =
    sessionData?.session;

  if (!session?.access_token) {

    throw new Error(
      "جلسة الدخول انتهت. سجّل الدخول مرة ثانية."
    );
  }

  const payload = {
    messages: state.messages.slice(-20)
  };

  const {
    data,
    error
  } = await db.functions.invoke(
    "ai-chat",
    {
      body: payload
    }
  );

  if (error) {

    console.error(
      "Edge Function error:",
      error
    );

    throw new Error(
      "تعذّر الاتصال بـ ai-chat. تأكد أن Edge Function منشورة وأنها تستقبل POST."
    );
  }

  if (!data) {

    throw new Error(
      "Edge Function رجعت استجابة فارغة."
    );
  }

  if (data.error) {

    throw new Error(
      data.error
    );
  }

  const reply =
    data.reply ||
    data.answer ||
    data.message;

  if (
    typeof reply !== "string" ||
    !reply.trim()
  ) {

    console.error(
      "Invalid AI response:",
      data
    );

    throw new Error(
      "الذكاء الاصطناعي ما رجّع جواب صالح."
    );
  }

  return reply.trim();
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

  if (state.sending) {
    return;
  }

  const input =
    $("messageInput");

  const text =
    input.value.trim();

  if (!text) {
    return;
  }

  if (!state.user) {

    showToast(
      "سجّل الدخول أولاً.",
      true
    );

    return;
  }

  state.sending = true;

  $("sendButton").disabled =
    true;

  input.value = "";

  autoResizeTextarea();

  try {

    /*
      إذا ما عندنا محادثة حالياً،
      ننشئ واحدة قبل الإرسال.
    */

    if (!state.currentId) {

      await createConversation(
        text
      );
    }

    state.messages.push({
      role: "user",
      content: text
    });

    renderMessages();

    addTyping();

    await saveCurrentConversation();

    const answer =
      await callAIChat();

    removeTyping();

    state.messages.push({
      role: "assistant",
      content: answer
    });

    renderMessages();

    await saveCurrentConversation();

    showToast(
      "تم استلام الرد."
    );

  } catch (error) {

    console.error(
      "Send message error:",
      error
    );

    removeTyping();

    /*
      إذا الرسالة انضافت للمحادثة
      وما صار رد، نعرض الخطأ.
    */

    addMessageToDOM(
      "assistant",
      "عذراً، ما گدرت أحصل على رد من الذكاء الاصطناعي.\n\n" +
      translateError(error)
    );

    scrollToBottom();

  } finally {

    state.sending = false;

    $("sendButton").disabled =
      false;

    input.focus();
  }
}


$("sendButton").addEventListener(
  "click",
  sendMessage
);


$("messageInput").addEventListener(
  "keydown",
  (event) => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();
    }
  }
);


/* =========================================================
   TEXTAREA
========================================================= */

function autoResizeTextarea() {

  const textarea =
    $("messageInput");

  textarea.style.height =
    "auto";

  textarea.style.height =
    Math.min(
      textarea.scrollHeight,
      180
    ) + "px";
}


$("messageInput").addEventListener(
  "input",
  autoResizeTextarea
);


/* =========================================================
   LOGOUT
========================================================= */

$("logoutButton").addEventListener(
  "click",
  async () => {

    const {
      error
    } = await db.auth.signOut();

    if (error) {

      showToast(
        translateError(error),
        true
      );

      return;
    }

    showToast(
      "تم تسجيل الخروج."
    );
  }
);


/* =========================================================
   MOBILE SIDEBAR
========================================================= */

$("mobileMenu").addEventListener(
  "click",
  () => {

    $("sidebar").classList.toggle(
      "open"
    );
  }
);


function closeMobileSidebar() {

  $("sidebar").classList.remove(
    "open"
  );
}


/* =========================================================
   START
========================================================= */

updateAuthUI();

initialize();

</script>
