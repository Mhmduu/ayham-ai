<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d1c"><title>Ayham AI</title>
<style>
:root{color-scheme:dark;--bg:#080d1c;--panel:#111a2e;--line:#273552;--cyan:#42e8d5;--blue:#70a7ff;--text:#f4f7ff;--muted:#a8b5ce}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top right,#18294b,transparent 48%),radial-gradient(ellipse at bottom left,#241744,transparent 42%),var(--bg);font-family:system-ui,Tahoma,sans-serif;color:var(--text);display:grid;place-items:center;padding:22px}.wrap{width:min(100%,460px)}.brand{text-align:center;margin-bottom:22px}.logo{width:66px;height:66px;border-radius:22px;margin:0 auto 12px;display:grid;place-items:center;font-size:28px;font-weight:900;color:#06111e;background:linear-gradient(135deg,var(--cyan),var(--blue))}h1{font-size:28px;margin:0 0 5px}.brand p,.hint,footer{color:var(--muted)}.card{border:1px solid #ffffff18;background:linear-gradient(145deg,#121c31ee,#0d1426f2);border-radius:24px;padding:24px;box-shadow:0 24px 80px #0007}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#080e1d;border:1px solid var(--line);padding:4px;border-radius:14px;gap:4px;margin-bottom:22px}.tabs button{border:0;background:transparent;color:var(--muted);padding:11px;border-radius:10px;font:inherit}.tabs button.active{background:#21314e;color:white}label{display:block;font-size:14px;margin:14px 0 7px}input{width:100%;border:1px solid var(--line);background:#080f20;color:white;padding:13px 14px;border-radius:12px;font:inherit;outline:none}input:focus{border-color:var(--cyan)}.primary{width:100%;margin-top:20px;border:0;border-radius:13px;padding:14px;font:inherit;font-weight:800;color:#06111e;background:linear-gradient(100deg,var(--cyan),var(--blue))}.message{display:none;padding:12px;border-radius:12px;margin-top:15px;font-size:14px;line-height:1.7;overflow-wrap:anywhere}.message.show{display:block}.error{background:#481e2a;color:#ffd7dd}.success{background:#123b32;color:#d4ffea}.account{display:none}.account.show{display:block}.hint{font-size:12px;line-height:1.8}.signout{margin-top:14px;border:1px solid var(--line);background:transparent;color:white;border-radius:12px;padding:11px;font:inherit}footer{text-align:center;font-size:12px;margin-top:18px}
</style></head><body><main class="wrap"><header class="brand"><div class="logo">A</div><h1>Ayham AI</h1><p>مساحتك الذكية، خطوة بخطوة</p></header>
<section class="card" id="authCard"><div class="tabs"><button id="loginTab" class="active" type="button">تسجيل الدخول</button><button id="signupTab" type="button">إنشاء حساب</button></div>
<form id="authForm"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com" required><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="6 أحرف على الأقل" required><button class="primary" id="submitBtn" type="submit">تسجيل الدخول</button></form><div id="message" class="message" role="status"></div><p class="hint">لا تشارك كلمة المرور مع أي شخص.</p></section>
<section class="card account" id="accountCard"><h2>أهلاً بيك في Ayham AI ✨</h2><p id="userEmail"></p><p id="credits">جاري تحميل معلومات الحساب…</p><button class="signout" id="signoutBtn" type="button">تسجيل الخروج</button><div id="accountMessage" class="message"></div></section><footer>Ayham AI · نسخة أولية لتجربة التسجيل</footer></main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://yyhykirxcsbgfddjyuti.supabase.co','sb_publishable_ulGr0S06yyfBBzsiJqSeRQ_p3sO5dxh');
const authCard=document.querySelector('#authCard'), accountCard=document.querySelector('#accountCard'), form=document.querySelector('#authForm'), emailInput=document.querySelector('#email'), passwordInput=document.querySelector('#password'), submitBtn=document.querySelector('#submitBtn'), message=document.querySelector('#message'), accountMessage=document.querySelector('#accountMessage'), loginTab=document.querySelector('#loginTab'), signupTab=document.querySelector('#signupTab');let mode='login';
function msg(el,text,kind='error'){el.textContent=text;el.className='message show '+kind}function clear(){message.className='message';message.textContent=''}
function setMode(m){mode=m;loginTab.classList.toggle('active',m==='login');signupTab.classList.toggle('active',m==='signup');submitBtn.textContent=m==='login'?'تسجيل الدخول':'إنشاء حساب';passwordInput.autocomplete=m==='login'?'current-password':'new-password';clear()}
loginTab.onclick=()=>setMode('login');signupTab.onclick=()=>setMode('signup');
async function showUser(user){authCard.style.display='none';accountCard.classList.add('show');document.querySelector('#userEmail').textContent=user.email||'حسابك';const c=document.querySelector('#credits');const {data,error}=await supabase.from('profiles').select('credits').eq('id',user.id).maybeSingle();c.textContent=error?'تم الدخول، لكن تعذر تحميل الرصيد.':data?`الرصيد التجريبي: ${data.credits??20} نقطة`:'تم الدخول. ملف الحساب غير موجود بعد.'}
function signedOut(){accountCard.classList.remove('show');authCard.style.display='block'}
form.onsubmit=async e=>{e.preventDefault();clear();submitBtn.disabled=true;submitBtn.textContent='لحظة…';try{const email=emailInput.value.trim(),password=passwordInput.value;if(mode==='signup'){const {data,error}=await supabase.auth.signUp({email,password});if(error)throw error;if(data.session&&data.user)await showUser(data.user);else{msg(message,'تم إرسال طلب إنشاء الحساب. افتح بريدك واضغط رابط التأكيد إذا كان تأكيد البريد مفعّلاً.','success');setMode('login')}}else{const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;await showUser(data.user)}}catch(e){msg(message,e?.message||'صار خطأ، حاول مرة ثانية.')}finally{submitBtn.disabled=false;submitBtn.textContent=mode==='login'?'تسجيل الدخول':'إنشاء حساب'}};
document.querySelector('#signoutBtn').onclick=async()=>{const {error}=await supabase.auth.signOut();if(error)msg(accountMessage,error.message);else signedOut()};
const {data:{session}}=await supabase.auth.getSession();if(session?.user)showUser(session.user);supabase.auth.onAuthStateChange((_event,s)=>{if(s?.user)showUser(s.user);else signedOut()});
</script></body></html>
