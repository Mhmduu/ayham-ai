<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>Ayham AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0b0b0d;
      --panel: #121216;
      --panel2: #18181d;
      --border: #292930;
      --text: #f5f5f7;
      --muted: #96969f;
      --accent: #ffffff;
      --accentText: #111111;
      --danger: #ff5f56;
      --user: #25252c;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Arial,
        "Noto Sans Arabic",
        sans-serif;
      min-height: 100vh;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       AUTH
    ========================= */

    #authScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 430px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 17px;
      background: #fff;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 900;
      margin: 0 auto 16px;
    }

    .auth-title {
      text-align: center;
      margin: 0;
      font-size: 25px;
    }

    .auth-subtitle {
      text-align: center;
      color: var(--muted);
      margin: 8px 0 25px;
      font-size: 14px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      color: #d8d8dd;
    }

    .field input {
      width: 100%;
      padding: 13px 14px;
      background: #0d0d10;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: white;
      outline: none;
    }

    .field input:focus {
      border-color: #55555f;
    }

    .primary-btn {
      width: 100%;
      border: 0;
      background: white;
      color: #111;
      padding: 13px;
      border-radius: 12px;
      font-weight: 700;
      margin-top: 5px;
    }

    .secondary-btn {
      width: 100%;
      border: 1px solid var(--border);
      background: transparent;
      color: white;
      padding: 12px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .auth-links {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 18px;
    }

    .auth-link {
      background: none;
      border: 0;
      color: #c9c9d0;
      font-size: 13px;
      padding: 0;
    }

    .auth-link:hover {
      color: white;
    }

    .auth-error {
      background: rgba(255, 95, 86, .1);
      border: 1px solid rgba(255,95,86,.25);
      color: #ff817b;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      margin-bottom: 14px;
      line-height: 1.6;
    }

    /* =========================
       APP
    ========================= */

    #app {
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: #101014;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 6px 18px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: white;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 700;
    }

    .brand-small {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .new-chat {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #1b1b20;
      color: white;
      margin-bottom: 14px;
    }

    .new-chat:hover {
      background: #222229;
    }

    .section-title {
      color: var(--muted);
      font-size: 12px;
      padding: 8px 6px;
    }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
      padding: 3px;
    }

    .conversation {
      width: 100%;
      border: 0;
      background: transparent;
      color: #d8d8dd;
      text-align: right;
      padding: 11px;
      border-radius: 10px;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation:hover {
      background: #1c1c21;
    }

    .conversation.active {
      background: #24242b;
      color: white;
    }

    .account {
      border-top: 1px solid var(--border);
      padding-top: 13px;
      margin-top: 10px;
    }

    .account-email {
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 10px;
    }

    .logout {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: #ddd;
      border-radius: 10px;
    }

    .logout:hover {
      background: #1c1c21;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .topbar {
      height: 60px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 12px;
      background: rgba(11,11,13,.92);
    }

    .mobile-menu {
      display: none;
      border: 0;
      background: transparent;
      color: white;
      font-size: 22px;
    }

    .chat-title {
      font-size: 15px;
      font-weight: 700;
      flex: 1;
      text-align: center;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 25px 16px 120px;
    }

    .messages {
      width: 100%;
      max-width: 850px;
      margin: auto;
    }

    .welcome {
      min-height: 55vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .welcome-logo {
      width: 65px;
      height: 65px;
      background: white;
      color: #111;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .welcome h1 {
      margin: 0 0 9px;
      font-size: 28px;
    }

    .welcome p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .message-row {
      display: flex;
      margin-bottom: 22px;
      gap: 10px;
    }

    .message-row.user {
      justify-content: flex-start;
    }

    .message-row.assistant {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: min(760px, 88%);
      padding: 13px 15px;
      border-radius: 16px;
      line-height: 1.75;
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user .message-bubble {
      background: var(--user);
      color: white;
      border-bottom-right-radius: 5px;
    }

    .assistant .message-bubble {
      background: transparent;
      color: #ededf0;
      border-bottom-left-radius: 5px;
    }

    .message-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 16px 18px;
      background: linear-gradient(
        to top,
        var(--bg) 65%,
        transparent
      );
    }

    .composer {
      width: 100%;
      max-width: 850px;
      margin: auto;
      background: #17171c;
      border: 1px solid #303038;
      border-radius: 17px;
      display: flex;
      align-items: flex-end;
      padding: 8px;
    }

    #messageInput {
      flex: 1;
      min-height: 42px;
      max-height: 160px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      padding: 10px;
      line-height: 1.5;
    }

    #messageInput::placeholder {
      color: #777780;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 12px;
      background: white;
      color: #111;
      font-size: 18px;
      font-weight: 900;
    }

    .send-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    /* =========================
       TOAST
    ========================= */

    #toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%) translateY(20px);
      background: #222229;
      border: 1px solid #363640;
      color: white;
      padding: 11px 16px;
      border-radius: 12px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 1000;
      max-width: calc(100% - 30px);
      text-align: center;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast.error {
      border-color: rgba(255,95,86,.4);
      color: #ffaaa5;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 760px) {
      .sidebar {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 100;
        transform: translateX(100%);
        transition: transform .25s;
        width: 285px;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .mobile-menu {
        display: block;
      }

      .topbar {
        height: 56px;
      }

      .chat-title {
        text-align: center;
      }

      .message-bubble {
        max-width: 92%;
      }

      .composer-wrap {
        padding: 10px;
      }

      .chat-area {
        padding-left: 10px;
        padding-right: 10px;
      }

      .welcome h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       AUTH SCREEN
  ========================= -->

  <section id="authScreen">

    <div class="auth-box">

      <div class="logo">AI</div>

      <h1
        id="authTitle"
        class="auth-title"
      >
        تسجيل الدخول
      </h1>

      <p
        id="authSubtitle"
        class="auth-subtitle"
      >
        سجّل دخولك حتى تستخدم Ayham AI
      </p>

      <div
        id="authError"
        class="auth-error hidden"
      ></div>

      <div
        id="nameField"
        class="field hidden"
      >
        <label>الاسم</label>

        <input
          id="nameInput"
          type="text"
          placeholder="اكتب اسمك"
          autocomplete="name"
        />
      </div>

      <div class="field">
        <label>البريد الإلكتروني</label>

        <input
          id="emailInput"
          type="email"
          placeholder="example@email.com"
          autocomplete="email"
        />
      </div>

      <div
        id="passwordField"
        class="field"
      >
        <label>كلمة المرور</label>

        <input
          id="passwordInput"
          type="password"
          placeholder="كلمة المرور"
          autocomplete="current-password"
        />
      </div>

      <button
        id="authButton"
        class="primary-btn"
      >
        تسجيل الدخول
      </button>

      <button
        id="forgotButton"
        class="secondary-btn"
      >
        نسيت كلمة المرور؟
      </button>

      <div class="auth-links">

        <button
          id="switchAuth"
          class="auth-link"
        >
          إنشاء حساب جديد
        </button>

      </div>

    </div>

  </section>


  <!-- =========================
       APP
  ========================= -->

  <div
    id="app"
    class="hidden"
  >

    <!-- SIDEBAR -->

    <aside
      id="sidebar"
      class="sidebar"
    >

      <div class="brand">

        <div class="brand-icon">
          AI
        </div>

        <div>
          <div class="brand-name">
            Ayham AI
          </div>

          <div class="brand-small">
            مساعدك الذكي
          </div>
        </div>

      </div>

      <button
        id="newChat"
        class="new-chat"
      >
        + محادثة جديدة
      </button>

      <div class="section-title">
        محادثاتك
      </div>

      <div
        id="conversationList"
        class="conversation-list"
      ></div>

      <div class="account">

        <div
          id="accountEmail"
          class="account-email"
        ></div>

        <button
          id="logoutButton"
          class="logout"
        >
          تسجيل الخروج
        </button>

      </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

      <header class="topbar">

        <button
          id="mobileMenu"
          class="mobile-menu"
        >
          ☰
        </button>

        <div
          id="chatTitle"
          class="chat-title"
        >
          محادثة جديدة
        </div>

      </header>


      <section
        id="chatArea"
        class="chat-area"
      >

        <div
          id="messages"
          class="messages"
        >

          <div
            id="welcome"
            class="welcome"
          >

            <div class="welcome-logo">
              AI
            </div>

            <h1>
              شلون أگدر أساعدك؟
            </h1>

            <p>
              اسألني أي سؤال وراح أحاول أساعدك.
            </p>

          </div>

        </div>

      </section>


      <!-- COMPOSER -->

      <div class="composer-wrap">

        <div class="composer">

          <textarea
            id="messageInput"
            rows="1"
            placeholder="اكتب رسالتك هنا..."
          ></textarea>

          <button
            id="sendButton"
            class="send-btn"
            title="إرسال"
          >
            ↑
          </button>

        </div>

      </div>

    </main>

  </div>


  <div id="toast"></div>


  <script>
    /* =====================================================
       SUPABASE
    ===================================================== */

    const SUPABASE_URL =
      "https://yyhykirxcsbgfddjyuti.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_ulGr0S6yyfBBzsiJqSeRQ_p3sO5dxh";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    /* =====================================================
       HELPERS
    ===================================================== */

    const $ = (id) =>
      document.getElementById(id);


    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function showToast(
      message,
      isError = false
    ) {
      const toast = $("toast");

      toast.textContent = message;

      toast.classList.toggle(
        "error",
        isError
      );

      toast.classList.add("show");

      clearTimeout(
        showToast.timer
      );

      showToast.timer =
        setTimeout(() => {
          toast.classList.remove("show");
        }, 3500);
    }


    /* =====================================================
       STATE
    ===================================================== */

    const state = {
      user: null,
      profile: null,
      conversations: [],
      currentId: null,
      messages: [],
      authMode: "login",
      sending: false
    };


    /* =====================================================
       AUTH UI
    ===================================================== */

    function setAuthMode(mode) {

      state.authMode = mode;

      const isLogin =
        mode === "login";

      const isSignup =
        mode === "signup";

      const isReset =
        mode === "reset";

      $("authError")
        .classList.add("hidden");

      $("nameField")
        .classList.toggle(
          "hidden",
          !isSignup
        );

      $("passwordField")
        .classList.toggle(
          "hidden",
          isReset
        );

      if (isLogin) {

        $("authTitle").textContent =
          "تسجيل الدخول";

        $("authSubtitle").textContent =
          "سجّل دخولك حتى تستخدم Ayham AI";

        $("authButton").textContent =
          "تسجيل الدخول";

        $("forgotButton").classList.remove(
          "hidden"
        );

        $("switchAuth").textContent =
          "إنشاء حساب جديد";

      } else if (isSignup) {

        $("authTitle").textContent =
          "إنشاء حساب";

        $("authSubtitle").textContent =
          "أنشئ حسابك وابدأ استخدام Ayham AI";

        $("authButton").textContent =
          "إنشاء الحساب";

        $("forgotButton").classList.add(
          "hidden"
        );

        $("switchAuth").textContent =
          "عندي حساب بالفعل";

      } else {

        $("authTitle").textContent =
          "استعادة كلمة المرور";

        $("authSubtitle").textContent =
          "أدخل بريدك الإلكتروني حتى نرسل رابط الاستعادة";

        $("authButton").textContent =
          "إرسال رابط الاستعادة";

        $("forgotButton").classList.add(
          "hidden"
        );

        $("switchAuth").textContent =
          "العودة لتسجيل الدخول";
      }
    }


    function showAuthError(message) {

      const box =
        $("authError");

      box.textContent =
        message;

      box.classList.remove(
        "hidden"
      );
    }


    async function handleAuth() {

      const email =
        $("emailInput")
          .value
          .trim();

      const password =
        $("passwordInput")
          .value;

      const name =
        $("nameInput")
          .value
          .trim();

      if (!email) {
        showAuthError(
          "اكتب البريد الإلكتروني."
        );
        return;
      }

      if (
        state.authMode !== "reset" &&
        !password
      ) {
        showAuthError(
          "اكتب كلمة المرور."
        );
        return;
      }

      $("authButton").disabled = true;

      try {

        if (
          state.authMode === "login"
        ) {

          const {
            error
          } = await db.auth.signInWithPassword({
            email,
            password
          });

          if (error) {
            throw error;
          }

        } else if (
          state.authMode === "signup"
        ) {

          const {
            data,
            error
          } = await db.auth.signUp({
            email,
            password,
            options: {
              data: {
                display_name:
                  name ||
                  email.split("@")[0]
              }
            }
          });

          if (error) {
            throw error;
          }

          if (!data.session) {

            showToast(
              "تم إنشاء الحساب. افحص بريدك الإلكتروني لتأكيد الحساب."
            );

            setAuthMode("login");

            return;
          }

        } else {

          const {
            error
          } = await db.auth.resetPasswordForEmail(
            email,
            {
              redirectTo:
                window.location.origin
            }
          );

          if (error) {
            throw error;
          }

          showToast(
            "تم إرسال رابط استعادة كلمة المرور إلى بريدك."
          );

          setAuthMode("login");

          return;
        }

      } catch (error) {

        console.error(
          "Auth error:",
          error
        );

        showAuthError(
          error?.message ||
          "صار خطأ. حاول مرة ثانية."
        );

      } finally {

        $("authButton").disabled = false;
      }
    }


    /* =====================================================
       PROFILE
    ===================================================== */

    async function loadProfile() {

      if (!state.user) {
        return;
      }

      const {
        data,
        error
      } = await db
        .from("profiles")
        .select(
          "id, display_name"
        )
        .eq(
          "id",
          state.user.id
        )
        .maybeSingle();

      if (error) {

        console.error(
          "Profile error:",
          error
        );

        return;
      }

      state.profile =
        data;

      $("accountEmail").textContent =
        state.user.email || "";
    }


    /* =====================================================
       INITIALIZE USER
    ===================================================== */

    async function initializeUser(
      user
    ) {

      state.user =
        user;

      if (!user) {

        state.profile = null;
        state.conversations = [];
        state.currentId = null;
        state.messages = [];

        $("app")
          .classList.add("hidden");

        $("authScreen")
          .classList.remove("hidden");

        return;
      }

      $("authScreen")
        .classList.add("hidden");

      $("app")
        .classList.remove("hidden");

      $("accountEmail").textContent =
        user.email || "";

      await loadProfile();

      await loadConversations();

      if (
        state.conversations.length === 0
      ) {

        newConversation();

      } else {

        await loadConversation(
          state.conversations[0].id
        );
      }
    }


    /* =====================================================
       CONVERSATIONS
    ===================================================== */

    async function loadConversations() {

      if (!state.user) {
        return;
      }

      const {
        data,
        error
      } = await db
        .from("conversations")
        .select(
          "id, title, messages, created_at, updated_at"
        )
        .eq(
          "user_id",
          state.user.id
        )
        .order(
          "updated_at",
          {
            ascending: false
          }
        );

      if (error) {

        console.error(
          "Conversations error:",
          error
        );

        showToast(
          "تعذّر تحميل المحادثات.",
          true
        );

        return;
      }

      state.conversations =
        data || [];

      renderConversationList();
    }


    function renderConversationList() {

      const list =
        $("conversationList");

      list.innerHTML = "";

      if (
        state.conversations.length === 0
      ) {

        const empty =
          document.createElement("div");

        empty.style.cssText =
          "color:#777780;font-size:12px;padding:10px;";

        empty.textContent =
          "ماكو محادثات بعد.";

        list.appendChild(
          empty
        );

        return;
      }

      state.conversations.forEach(
        (conversation) => {

          const button =
            document.createElement("button");

          button.className =
            "conversation";

          if (
            conversation.id ===
            state.currentId
          ) {
            button.classList.add(
              "active"
            );
          }

          button.textContent =
            conversation.title ||
            "محادثة جديدة";

          button.onclick =
            () =>
              loadConversation(
                conversation.id
              );

          list.appendChild(
            button
          );
        }
      );
    }


    function newConversation() {

      state.currentId =
        null;

      state.messages =
        [];

      $("chatTitle").textContent =
        "محادثة جديدة";

      renderMessages();

      renderConversationList();

      $("messageInput").focus();

      $("sidebar")
        .classList.remove("open");
    }


    async function loadConversation(
      id
    ) {

      const conversation =
        state.conversations.find(
          (item) =>
            item.id === id
        );

      if (!conversation) {
        return;
      }

      state.currentId =
        conversation.id;

      state.messages =
        Array.isArray(
          conversation.messages
        )
          ? conversation.messages
          : [];

      $("chatTitle").textContent =
        conversation.title ||
        "محادثة جديدة";

      renderMessages();

      renderConversationList();

      $("sidebar")
        .classList.remove("open");
    }


    async function saveConversation() {

      if (!state.user) {
        return;
      }

      const firstUserMessage =
        state.messages.find(
          (message) =>
            message.role === "user"
        );

      let title =
        firstUserMessage?.content ||
        "محادثة جديدة";

      title =
        title
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, 50);

      if (!title) {
        title =
          "محادثة جديدة";
      }

      if (state.currentId) {

        const {
          error
        } = await db
          .from("conversations")
          .update({
            title,
            messages:
              state.messages,
            updated_at:
              new Date().toISOString()
          })
          .eq(
            "id",
            state.currentId
          )
          .eq(
            "user_id",
            state.user.id
          );

        if (error) {
          console.error(
            "Update conversation error:",
            error
          );
        }

      } else {

        const {
          data,
          error
        } = await db
          .from("conversations")
          .insert({
            user_id:
              state.user.id,
            title,
            messages:
              state.messages
          })
          .select()
          .single();

        if (error) {

          console.error(
            "Insert conversation error:",
            error
          );

          return;
        }

        state.currentId =
          data.id;
      }

      $("chatTitle").textContent =
        title;

      await loadConversations();
    }


    /* =====================================================
       RENDER MESSAGES
    ===================================================== */

    function renderMessages() {

      const container =
        $("messages");

      container.innerHTML = "";

      if (
        state.messages.length === 0
      ) {

        const welcome =
          document.createElement("div");

        welcome.className =
          "welcome";

        welcome.innerHTML = `
          <div class="welcome-logo">AI</div>
          <h1>شلون أگدر أساعدك؟</h1>
          <p>اسألني أي سؤال وراح أحاول أساعدك.</p>
        `;

        container.appendChild(
          welcome
        );

        return;
      }

      state.messages.forEach(
        (message) => {

          const row =
            document.createElement("div");

          row.className =
            "message-row " +
            (
              message.role === "user"
                ? "user"
                : "assistant"
            );

          const bubble =
            document.createElement("div");

          bubble.className =
            "message-bubble";

          bubble.textContent =
            message.content;

          row.appendChild(
            bubble
          );

          container.appendChild(
            row
          );
        }
      );

      const area =
        $("chatArea");

      setTimeout(() => {
        area.scrollTop =
          area.scrollHeight;
      }, 0);
    }


    /* =====================================================
       AI RESPONSE
    ===================================================== */

    function extractAIReply(
      data
    ) {

      if (
        typeof data?.reply ===
        "string"
      ) {
        return data.reply;
      }

      if (
        typeof data?.answer ===
        "string"
      ) {
        return data.answer;
      }

      if (
        typeof data?.content ===
        "string"
      ) {
        return data.content;
      }

      if (
        typeof data?.message ===
        "string"
      ) {
        return data.message;
      }

      if (
        typeof data?.choices?.[0]?.message?.content ===
        "string"
      ) {
        return data
          .choices[0]
          .message
          .content;
      }

      return "";
    }


    async function callAIChat(
      userMessage
    ) {

      try {

        /*
         * مهم:
         * نجيب جلسة Supabase الحالية
         * ونرسل access_token للـ Edge Function.
         */

        const {
          data: sessionData,
          error: sessionError
        } = await db.auth.getSession();

        if (sessionError) {

          console.error(
            "Session error:",
            sessionError
          );

          throw new Error(
            "تعذّر التحقق من جلسة الدخول."
          );
        }

        const session =
          sessionData?.session;

        if (
          !session?.access_token
        ) {

          throw new Error(
            "جلسة الدخول منتهية. سجّل الدخول مرة ثانية."
          );
        }

        const requestBody = {
          message:
            userMessage,

          messages:
            state.messages,

          user_id:
            state.user?.id || null,

          conversation_id:
            state.currentId || null
        };

        const {
          data,
          error
        } = await db.functions.invoke(
          "ai-chat",
          {
            body:
              requestBody,

            headers: {
              Authorization:
                `Bearer ${session.access_token}`
            }
          }
        );

        if (error) {

          console.error(
            "Edge Function error:",
            error
          );

          throw new Error(
            error.message ||
            "Failed to send a request to the Edge Function"
          );
        }

        if (!data) {

          throw new Error(
            "ما وصل رد من الذكاء الاصطناعي."
          );
        }

        if (data.error) {

          throw new Error(
            data.error
          );
        }

        const reply =
          extractAIReply(
            data
          );

        if (!reply) {

          console.error(
            "Invalid AI response:",
            data
          );

          throw new Error(
            "ما گدرت أحصل على رد من الذكاء الاصطناعي."
          );
        }

        return reply;

      } catch (error) {

        console.error(
          "callAIChat error:",
          error
        );

        throw error;
      }
    }


    /* =====================================================
       SEND MESSAGE
    ===================================================== */

    async function sendMessage() {

      if (
        state.sending
      ) {
        return;
      }

      if (
        !state.user
      ) {
        showToast(
          "سجّل الدخول أولاً.",
          true
        );
        return;
      }

      const input =
        $("messageInput");

      const text =
        input.value.trim();

      if (!text) {
        return;
      }

      state.sending =
        true;

      $("sendButton").disabled =
        true;

      input.value = "";

      autoResizeTextarea();

      state.messages.push({
        role: "user",
        content: text
      });

      renderMessages();

      const loading =
        document.createElement("div");

      loading.className =
        "message-row assistant";

      loading.id =
        "aiLoading";

      loading.innerHTML = `
        <div
          class="message-bubble"
          style="color:#888"
        >
          يكتب...
        </div>
      `;

      $("messages")
        .appendChild(
          loading
        );

      $("chatArea").scrollTop =
        $("chatArea").scrollHeight;

      try {

        const reply =
          await callAIChat(
            text
          );

        const loadingElement =
          $("aiLoading");

        if (
          loadingElement
        ) {
          loadingElement.remove();
        }

        state.messages.push({
          role: "assistant",
          content: reply
        });

        renderMessages();

        await saveConversation();

      } catch (error) {

        const loadingElement =
          $("aiLoading");

        if (
          loadingElement
        ) {
          loadingElement.remove();
        }

        console.error(
          "Send message error:",
          error
        );

        showToast(
          error?.message ||
          "صار خطأ أثناء إرسال الرسالة.",
          true
        );

        renderMessages();

      } finally {

        state.sending =
          false;

        $("sendButton").disabled =
          false;

        input.focus();
      }
    }


    /* =====================================================
       TEXTAREA
    ===================================================== */

    function autoResizeTextarea() {

      const input =
        $("messageInput");

      input.style.height =
        "auto";

      input.style.height =
        Math.min(
          input.scrollHeight,
          160
        ) + "px";
    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    async function logout() {

      const {
        error
      } = await db.auth.signOut();

      if (error) {

        showToast(
          "تعذّر تسجيل الخروج.",
          true
        );

        return;
      }

      state.user = null;
      state.profile = null;
      state.conversations = [];
      state.currentId = null;
      state.messages = [];

      $("app")
        .classList.add("hidden");

      $("authScreen")
        .classList.remove("hidden");

      $("emailInput").value = "";
      $("passwordInput").value = "";
      $("nameInput").value = "";

      setAuthMode("login");
    }


    /* =====================================================
       EVENTS
    ===================================================== */

    $("authButton")
      .addEventListener(
        "click",
        handleAuth
      );


    $("switchAuth")
      .addEventListener(
        "click",
        () => {

          if (
            state.authMode === "login"
          ) {

            setAuthMode(
              "signup"
            );

          } else {

            setAuthMode(
              "login"
            );
          }
        }
      );


    $("forgotButton")
      .addEventListener(
        "click",
        () => {

          setAuthMode(
            "reset"
          );
        }
      );


    $("newChat")
      .addEventListener(
        "click",
        newConversation
      );


    $("logoutButton")
      .addEventListener(
        "click",
        logout
      );


    $("sendButton")
      .addEventListener(
        "click",
        sendMessage
      );


    $("messageInput")
      .addEventListener(
        "input",
        autoResizeTextarea
      );


    $("messageInput")
      .addEventListener(
        "keydown",
        (event) => {

          if (
            event.key === "Enter" &&
            !event.shiftKey
          ) {

            event.preventDefault();

            sendMessage();
          }
        }
      );


    $("mobileMenu")
      .addEventListener(
        "click",
        () => {

          $("sidebar")
            .classList.toggle(
              "open"
            );
        }
      );


    /* =====================================================
       AUTH STATE
    ===================================================== */

    db.auth.onAuthStateChange(
      async (
        event,
        session
      ) => {

        /*
         * نخلي المعالجة بسيطة حتى ما يصير
         * تكرار تحميل للمحادثات.
         */

        if (
          session?.user
        ) {

          state.user =
            session.user;

          $("authScreen")
            .classList.add("hidden");

          $("app")
            .classList.remove("hidden");

          await initializeUser(
            session.user
          );

        } else {

          await initializeUser(
            null
          );
        }
      }
    );


    /* =====================================================
       START
    ===================================================== */

    (async () => {

      try {

        const {
          data,
          error
        } = await db.auth.getSession();

        if (error) {

          console.error(
            "Initial session error:",
            error
          );

          setAuthMode(
            "login"
          );

          return;
        }

        if (
          data?.session?.user
        ) {

          await initializeUser(
            data.session.user
          );

        } else {

          setAuthMode(
            "login"
          );
        }

      } catch (error) {

        console.error(
          "Startup error:",
          error
        );

        setAuthMode(
          "login"
        );
      }

    })();
  </script>

</body>
</html>
