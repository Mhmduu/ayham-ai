<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#212121">

  <title>Ayham AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: #212121;
      color: #ececec;
      font-family:
        Arial,
        "Noto Sans Arabic",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================================================
       AUTH
    ========================================================= */

    #authScreen {
      position: fixed;
      inset: 0;
      background: #212121;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
      overflow-y: auto;
    }

    .auth-card {
      width: min(420px, 100%);
      background: #2f2f2f;
      border: 1px solid #454545;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, .35);
    }

    .auth-logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      border-radius: 16px;
      background: #fff;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      font-weight: 900;
    }

    .auth-title {
      margin: 0;
      text-align: center;
      font-size: 25px;
      font-weight: 700;
    }

    .auth-subtitle {
      margin: 8px 0 25px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
      line-height: 1.7;
    }

    .auth-error {
      background: rgba(239, 68, 68, .12);
      border: 1px solid rgba(239, 68, 68, .3);
      color: #ff8e8e;
      border-radius: 10px;
      padding: 11px;
      margin-bottom: 15px;
      font-size: 13px;
      line-height: 1.6;
    }

    .auth-field {
      margin-bottom: 15px;
    }

    .auth-field label {
      display: block;
      color: #ddd;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .auth-field input {
      width: 100%;
      height: 46px;
      border: 1px solid #505050;
      border-radius: 10px;
      background: #212121;
      color: #fff;
      padding: 0 13px;
      outline: none;
    }

    .auth-field input:focus {
      border-color: #777;
    }

    .auth-main-btn {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #111;
      font-weight: 700;
      margin-top: 4px;
    }

    .auth-main-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .auth-secondary-btn {
      width: 100%;
      height: 44px;
      border: 1px solid #4d4d4d;
      border-radius: 10px;
      background: transparent;
      color: #ddd;
      margin-top: 10px;
    }

    .auth-link {
      display: block;
      margin: 17px auto 0;
      border: 0;
      background: transparent;
      color: #aaa;
      font-size: 13px;
    }

    .auth-link:hover {
      color: #fff;
    }

    /* =========================================================
       APP
    ========================================================= */

    #app {
      width: 100%;
      height: 100%;
      display: flex;
    }

    /* =========================================================
       SIDEBAR
    ========================================================= */

    .sidebar {
      width: 275px;
      flex: 0 0 275px;
      height: 100%;
      background: #171717;
      border-left: 1px solid #303030;
      display: flex;
      flex-direction: column;
      padding: 10px;
      position: relative;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 7px 14px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: #fff;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 700;
    }

    .brand-subtitle {
      color: #858585;
      font-size: 11px;
      margin-top: 2px;
    }

    .new-chat-btn {
      width: 100%;
      height: 43px;
      background: #242424;
      border: 1px solid #383838;
      border-radius: 10px;
      color: #eee;
      text-align: right;
      padding: 0 13px;
      margin-bottom: 12px;
    }

    .new-chat-btn:hover {
      background: #2c2c2c;
    }

    .sidebar-title {
      color: #777;
      font-size: 11px;
      padding: 7px 9px;
    }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      padding: 3px;
    }

    .conversation-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
      min-height: 43px;
      margin-bottom: 2px;
      padding: 0 6px 0 5px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #d5d5d5;
      text-align: right;
    }

    .conversation-item:hover,
    .conversation-item.active {
      background: #2a2a2a;
    }

    .conversation-title {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
    }

    .conversation-delete {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #888;
      opacity: 0;
    }

    .conversation-item:hover .conversation-delete,
    .conversation-item.active .conversation-delete {
      opacity: 1;
    }

    .conversation-delete:hover {
      background: #3a3a3a;
      color: #ff7777;
    }

    .account-box {
      border-top: 1px solid #303030;
      padding: 12px 5px 3px;
      margin-top: 8px;
    }

    .account-email {
      color: #999;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 6px 9px;
    }

    .logout-btn {
      width: 100%;
      height: 39px;
      background: transparent;
      border: 1px solid #383838;
      color: #ccc;
      border-radius: 9px;
    }

    .logout-btn:hover {
      background: #242424;
    }

    /* =========================================================
       MAIN
    ========================================================= */

    .main {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #212121;
    }

    .topbar {
      height: 58px;
      flex: 0 0 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border-bottom: 1px solid #303030;
      position: relative;
      z-index: 5;
    }

    .mobile-menu-btn {
      display: none;
      position: absolute;
      right: 12px;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #ddd;
      font-size: 21px;
    }

    .mobile-menu-btn:hover {
      background: #2d2d2d;
    }

    .top-title {
      max-width: 55%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 600;
    }

    /* =========================================================
       CHAT
    ========================================================= */

    .chat-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 15px 150px;
      scroll-behavior: smooth;
    }

    .messages {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .welcome {
      min-height: calc(100vh - 250px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .welcome-logo {
      width: 64px;
      height: 64px;
      border-radius: 19px;
      background: #fff;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .welcome h1 {
      margin: 0;
      font-size: 27px;
      font-weight: 700;
    }

    .welcome p {
      color: #999;
      font-size: 14px;
      margin: 10px 0 0;
    }

    .message-row {
      width: 100%;
      display: flex;
      margin-bottom: 26px;
    }

    .message-row.user {
      justify-content: flex-start;
    }

    .message-row.assistant {
      justify-content: flex-end;
    }

    .message-inner {
      width: min(100%, 850px);
      display: flex;
      gap: 11px;
    }

    .message-row.user .message-inner {
      flex-direction: row;
    }

    .message-row.assistant .message-inner {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      margin-top: 2px;
    }

    .user-avatar {
      background: #3b3b3b;
      color: #fff;
    }

    .ai-avatar {
      background: #fff;
      color: #111;
    }

    .message-content {
      min-width: 0;
      max-width: calc(100% - 42px);
    }

    .message-name {
      color: #999;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .message-row.user .message-name {
      text-align: right;
    }

    .message-row.assistant .message-name {
      text-align: left;
    }

    .bubble {
      color: #ececec;
      font-size: 15px;
      line-height: 1.85;
      overflow-wrap: anywhere;
    }

    .message-row.user .bubble {
      background: #303030;
      border-radius: 16px;
      padding: 11px 15px;
    }

    .message-row.assistant .bubble {
      padding: 2px 3px;
    }

    .bubble p {
      margin: 0 0 12px;
    }

    .bubble p:last-child {
      margin-bottom: 0;
    }

    .bubble ul,
    .bubble ol {
      margin: 8px 0;
      padding-right: 24px;
    }

    .bubble li {
      margin: 4px 0;
    }

    .bubble code.inline-code {
      background: #111;
      border: 1px solid #3a3a3a;
      padding: 2px 6px;
      border-radius: 5px;
      font-family: monospace;
      direction: ltr;
      unicode-bidi: plaintext;
    }

    .code-wrap {
      position: relative;
      margin: 12px 0;
      border: 1px solid #3b3b3b;
      border-radius: 10px;
      background: #111;
      overflow: hidden;
      direction: ltr;
    }

    .code-header {
      height: 35px;
      background: #181818;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 9px;
      color: #888;
      font-size: 11px;
    }

    .copy-code-btn {
      border: 0;
      background: #292929;
      color: #ccc;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 10px;
    }

    .copy-code-btn:hover {
      background: #3a3a3a;
    }

    .code-wrap pre {
      margin: 0;
      padding: 13px;
      overflow-x: auto;
      color: #eee;
      font-family:
        Consolas,
        Monaco,
        monospace;
      font-size: 12px;
      line-height: 1.65;
      direction: ltr;
      text-align: left;
      white-space: pre;
    }

    .copy-answer {
      margin-top: 7px;
      border: 0;
      background: transparent;
      color: #777;
      font-size: 11px;
      padding: 3px 5px;
    }

    .copy-answer:hover {
      color: #ddd;
    }

    /* =========================================================
       LOADING
    ========================================================= */

    .typing {
      display: flex;
      gap: 4px;
      align-items: center;
      height: 25px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: #aaa;
      border-radius: 50%;
      animation: typing 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes typing {
      0%, 70%, 100% {
        transform: translateY(0);
        opacity: .35;
      }

      35% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    /* =========================================================
       COMPOSER
    ========================================================= */

    .composer-area {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 15px 17px;
      background:
        linear-gradient(
          to top,
          #212121 68%,
          rgba(33,33,33,0)
        );
      z-index: 4;
    }

    .composer {
      width: min(900px, 100%);
      margin: 0 auto;
      background: #2f2f2f;
      border: 1px solid #4a4a4a;
      border-radius: 17px;
      display: flex;
      align-items: flex-end;
      padding: 8px;
      box-shadow: 0 5px 30px rgba(0,0,0,.18);
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      min-height: 43px;
      max-height: 180px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      padding: 10px 11px;
      line-height: 1.55;
      overflow-y: auto;
    }

    #messageInput::placeholder {
      color: #858585;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border: 0;
      border-radius: 12px;
      background: #fff;
      color: #111;
      font-size: 21px;
      font-weight: 900;
    }

    .send-btn:hover {
      background: #e8e8e8;
    }

    .send-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .composer-note {
      text-align: center;
      color: #777;
      font-size: 10px;
      margin-top: 7px;
    }

    /* =========================================================
       MOBILE OVERLAY
    ========================================================= */

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 15;
    }

    /* =========================================================
       TOAST
    ========================================================= */

    #toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      background: #303030;
      color: #eee;
      border: 1px solid #4a4a4a;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      z-index: 200;
      transition: .22s;
      max-width: calc(100% - 30px);
      text-align: center;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #toast.error {
      color: #ffaaaa;
      border-color: #713737;
    }

    /* =========================================================
       SCROLLBAR
    ========================================================= */

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 20px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 760px) {

      .sidebar {
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        transform: translateX(100%);
        transition: transform .25s ease;
        width: min(290px, 86vw);
        z-index: 30;
        box-shadow: -20px 0 50px rgba(0,0,0,.3);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-overlay.open {
        display: block;
      }

      .mobile-menu-btn {
        display: block;
      }

      .topbar {
        height: 55px;
        flex-basis: 55px;
      }

      .chat-scroll {
        padding: 15px 10px 145px;
      }

      .message-inner {
        width: 100%;
      }

      .avatar {
        width: 28px;
        height: 28px;
        flex-basis: 28px;
      }

      .message-content {
        max-width: calc(100% - 39px);
      }

      .bubble {
        font-size: 14px;
        line-height: 1.75;
      }

      .welcome {
        min-height: calc(100vh - 230px);
      }

      .welcome h1 {
        font-size: 23px;
      }

      .welcome p {
        font-size: 13px;
      }

      .composer-area {
        padding: 9px 9px 12px;
      }

      .composer {
        border-radius: 15px;
      }

      .composer-note {
        display: none;
      }

      .auth-card {
        padding: 24px 19px;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       AUTH
  ======================================================== -->

  <section id="authScreen">

    <div class="auth-card">

      <div class="auth-logo">
        AI
      </div>

      <h1
        id="authTitle"
        class="auth-title"
      >
        تسجيل الدخول
      </h1>

      <p
        id="authSubtitle"
        class="auth-subtitle"
      >
        سجّل دخولك حتى تستخدم Ayham AI
      </p>

      <div
        id="authError"
        class="auth-error hidden"
      ></div>

      <div
        id="nameField"
        class="auth-field hidden"
      >
        <label>الاسم</label>

        <input
          id="nameInput"
          type="text"
          placeholder="اسمك"
          autocomplete="name"
        >
      </div>

      <div class="auth-field">
        <label>البريد الإلكتروني</label>

        <input
          id="emailInput"
          type="email"
          placeholder="example@email.com"
          autocomplete="email"
        >
      </div>

      <div
        id="passwordField"
        class="auth-field"
      >
        <label>كلمة المرور</label>

        <input
          id="passwordInput"
          type="password"
          placeholder="كلمة المرور"
          autocomplete="current-password"
        >
      </div>

      <button
        id="authButton"
        class="auth-main-btn"
      >
        تسجيل الدخول
      </button>

      <button
        id="forgotButton"
        class="auth-secondary-btn"
      >
        نسيت كلمة المرور؟
      </button>

      <button
        id="switchAuth"
        class="auth-link"
      >
        إنشاء حساب جديد
      </button>

    </div>

  </section>


  <!-- =======================================================
       APP
  ======================================================== -->

  <div
    id="app"
    class="hidden"
  >

    <aside
      id="sidebar"
      class="sidebar"
    >

      <div class="brand">

        <div class="brand-logo">
          AI
        </div>

        <div>
          <div class="brand-name">
            Ayham AI
          </div>

          <div class="brand-subtitle">
            مساعدك الذكي
          </div>
        </div>

      </div>


      <button
        id="newChatButton"
        class="new-chat-btn"
      >
        ＋ محادثة جديدة
      </button>


      <div class="sidebar-title">
        المحادثات
      </div>


      <div
        id="conversationList"
        class="conversation-list"
      ></div>


      <div class="account-box">

        <div
          id="accountEmail"
          class="account-email"
        ></div>

        <button
          id="logoutButton"
          class="logout-btn"
        >
          تسجيل الخروج
        </button>

      </div>

    </aside>


    <div
      id="sidebarOverlay"
      class="sidebar-overlay"
    ></div>


    <main class="main">

      <header class="topbar">

        <button
          id="mobileMenuButton"
          class="mobile-menu-btn"
        >
          ☰
        </button>

        <div
          id="chatTitle"
          class="top-title"
        >
          محادثة جديدة
        </div>

      </header>


      <section
        id="chatScroll"
        class="chat-scroll"
      >

        <div
          id="messages"
          class="messages"
        ></div>

      </section>


      <div class="composer-area">

        <div class="composer">

          <textarea
            id="messageInput"
            rows="1"
            placeholder="اسأل Ayham AI..."
          ></textarea>

          <button
            id="sendButton"
            class="send-btn"
            title="إرسال"
          >
            ↑
          </button>

        </div>

        <div class="composer-note">
          Ayham AI قد يخطئ أحياناً. تحقق من المعلومات المهمة.
        </div>

      </div>

    </main>

  </div>


  <div id="toast"></div>


  <script>
    /* =========================================================
       SUPABASE
    ========================================================= */

    const SUPABASE_URL =
      "https://yyhykirxcsbgfddjyuti.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_ulGr0S6yyfBBzsiJqSeRQ_p3sO5dxh";

    const db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* =========================================================
       HELPERS
    ========================================================= */

    const $ = (id) =>
      document.getElementById(id);


    function showToast(
      message,
      error = false
    ) {

      const toast =
        $("toast");

      toast.textContent =
        message;

      toast.classList.toggle(
        "error",
        error
      );

      toast.classList.add(
        "show"
      );

      clearTimeout(
        showToast.timer
      );

      showToast.timer =
        setTimeout(() => {
          toast.classList.remove(
            "show"
          );
        }, 3500);
    }


    function escapeHTML(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }

    /* =========================================================
       AUTH
    ========================================================= */

    async function handleAuth() {

      const email =
        $("emailInput")
          .value
          .trim();

      const password =
        $("passwordInput")
          .value;

      const name =
        $("nameInput")
          .value
          .trim();

      if (!email) {

        showAuthError(
          "اكتب البريد الإلكتروني."
        );

        return;
      }


      if (
        state.authMode !== "reset" &&
        !password
      ) {

        showAuthError(
          "اكتب كلمة المرور."
        );

        return;
      }


      $("authButton")
        .disabled = true;


      try {

        if (
          state.authMode === "login"
        ) {

          const {
            error
          } =
            await db.auth.signInWithPassword({
              email,
              password
            });

          if (error) {
            throw error;
          }


        } else if (
          state.authMode === "signup"
        ) {

          const {
            data,
            error
          } =
            await db.auth.signUp({

              email,

              password,

              options: {
                data: {
                  display_name:
                    name ||
                    email.split("@")[0]
                }
              }
            });


          if (error) {
            throw error;
          }


          if (!data?.session) {

            showToast(
              "تم إنشاء الحساب. إذا كان تأكيد البريد مفعلاً، افتح بريدك وأكد الحساب."
            );

            setAuthMode(
              "login"
            );

            return;
          }


        } else {

          const {
            error
          } =
            await db.auth
              .resetPasswordForEmail(
                email,
                {
                  redirectTo:
                    window.location.origin
                }
              );


          if (error) {
            throw error;
          }


          showToast(
            "تم إرسال رابط الاستعادة إلى بريدك."
          );

          setAuthMode(
            "login"
          );

          return;
        }


      } catch (error) {

        console.error(
          "Auth error:",
          error
        );

        showAuthError(
          translateAuthError(
            error?.message
          )
        );

      } finally {

        $("authButton")
          .disabled = false;
      }
    }


    function translateAuthError(
      message
    ) {

      const text =
        String(
          message || ""
        ).toLowerCase();


      if (
        text.includes(
          "invalid login credentials"
        )
      ) {
        return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
      }


      if (
        text.includes(
          "email not confirmed"
        )
      ) {
        return "لازم تأكد بريدك الإلكتروني أولاً.";
      }


      if (
        text.includes(
          "user already registered"
        )
      ) {
        return "هذا البريد مسجل مسبقاً.";
      }


      if (
        text.includes(
          "password should be at least"
        )
      ) {
        return "كلمة المرور لازم تكون أقوى.";
      }


      return message ||
        "صار خطأ. حاول مرة ثانية.";
    }

      id

      const conversation =
        state.conversations.find(
          item =>
            item.id === id

      if (!conversation) {
        return;
      }


      state.currentId =
        conversation.id;


      state.messages =
        Array.isArray(
          conversation.messages
        )
          ? conversation.messages
          : [];


      $("chatTitle")
        .textContent =
        conversation.title ||
        "محادثة جديدة";


      renderMessages();

      renderConversationList();

      closeSidebar();

    async function deleteConversation(
      id
    ) {

      if (
        !confirm(
          "تحذف هاي المحادثة؟"
        )
      ) {
        return;
      }


      const {
        error
      } =
        await db
          .from("conversations")
          .delete()
          .eq(
            "id",
            id
          )
          .eq(
            "user_id",
            state.user.id
          );


      if (error) {

        console.error(
          "Delete conversation:",
          error
        );

        showToast(
          "تعذّر حذف المحادثة.",
          true
        );

        return;
      }


      if (
        state.currentId === id
      ) {

        state.currentId =
          null;

        state.messages =
          [];

        $("chatTitle")
          .textContent =
          "محادثة جديدة";

        renderMessages();

    async function saveConversation() {

      if (!state.user) {
        return;
      }


      const firstMessage =
        state.messages.find(
          message =>
            message.role ===
            "user"
        );


      let title =
        firstMessage?.content ||
        "محادثة جديدة";


      title =
        title
          .replace(
            /\s+/g,
            " "
          )
          .trim()
          .slice(
            0,
            60
          );


      if (!title) {
        title =
          "محادثة جديدة";
      }


      if (state.currentId) {

        const {
          error
        } =
          await db
            .from("conversations")
            .update({
              title,
              messages:
                state.messages,
              updated_at:
                new Date().toISOString()
            })
            .eq(
              "id",
              state.currentId
            )
            .eq(
              "user_id",
              state.user.id
            );


        if (error) {

          console.error(
            "Conversation update:",
            error
          );

          return;
        }


      } else {

        const {
          data,
          error
        } =
          await db
            .from("conversations")
            .insert({
              user_id:
                state.user.id,

              title,

              messages:
                state.messages
            })
            .select(
              "id"
            )
            .single();


        if (error) {

          console.error(
            "Conversation insert:",
            error
          );

          showToast(
            "تم الرد، لكن تعذّر حفظ المحادثة.",
            true
          );

          return;
        }


        state.currentId =
          data.id;
      }


      $("chatTitle")
        .textContent =
        title;


      await loadConversations();
    }


    /* =========================================================
       MARKDOWN-LIKE RENDERER
    ========================================================= */

    function renderAIText(
      text
    ) {

      let safe =
        escapeHTML(
          text
        );


      const codeBlocks =
        [];


      safe =
        safe.replace(
          /```([\s\S]*?)```/g,
          (
            full,
            code
          ) => {

            const index =
              codeBlocks.length;

            codeBlocks.push(
              code.trim()
            );

            return `@@CODE_${index}@@`;
          }
        );


      safe =
        safe.replace(
          /\*\*(.+?)\*\*/g,
          "<strong>$1</strong>"
        );


      safe =
        safe.replace(
          /`([^`]+)`/g,
          '<code class="inline-code">$1</code>'
        );


      const lines =
        safe.split("\n");


      let html =
        "";

      let listOpen =
        false;


      for (
        let i = 0;
        i < lines.length;
        i++
      ) {

        const line =
          lines[i];


        if (
          line.startsWith("- ") ||
          line.startsWith("• ")
        ) {

          if (!listOpen) {

            html +=
              "<ul>";

            listOpen =
              true;
          }


          html +=
            "<li>" +
            line.slice(2) +
            "</li>";

          continue;
        }


        if (listOpen) {

          html +=
            "</ul>";

          listOpen =
            false;
        }


        if (
          line.trim() === ""
        ) {

          html +=
            "<br>";

        } else {

          html +=
            "<p>" +
            line +
            "</p>";
        }
      }


      if (listOpen) {
        html += "</ul>";
      }


      html =
        html.replace(
          /@@CODE_(\d+)@@/g,
          (
            full,
            index
          ) => {

            const code =
              codeBlocks[
                Number(index)
              ] || "";

            const encoded =
              encodeURIComponent(
                code
              );


            return `
              <div class="code-wrap">
                <div class="code-header">
                  <span>Code</span>
                  <button
                    class="copy-code-btn"
                    data-code="${encoded}"
                  >
                    نسخ
                  </button>
                </div>
                <pre>${code}</pre>
              </div>
            `;
          }
        );


      return html;
    }

    async function copyText(

    ) {

      try {

        await navigator.clipboard.writeText(
          text
        );

        showToast(
          "تم النسخ."
        );

      } catch {

        showToast(
          "تعذّر النسخ.",
          true
        );
      }
    }

      "click",
      event => {

        const button =
          event.target.closest(
            ".copy-code-btn"
          );


        if (!button) {
          return;
        }


        try {

          const code =
            decodeURIComponent(
              button.dataset.code
            );


          navigator.clipboard
            .writeText(
              code
            );


          button.textContent =
            "تم النسخ ✓";


          setTimeout(() => {

            button.textContent =
              "نسخ";

          }, 1500);

        } catch {

      }
    );


    /* =========================================================
       AI REPLY
    ========================================================= */

    function extractAIReply(
      data
    ) {

      if (
        typeof data?.reply ===
        "string"
      ) {
        return data.reply.trim();
      }


      if (
        typeof data?.answer ===
        "string"
      ) {
        return data.answer.trim();
      }


      if (
        typeof data?.choices?.[0]?.message?.content ===
        "string"
      ) {

        return data
          .choices[0]
          .message
          .content
          .trim();
      }


      return "";
    }


    /* =========================================================
       CALL EDGE FUNCTION
    ========================================================= */

    async function callAIChat(
      userMessage
    ) {

      const {
        data,
        error
      } =
        await db.auth.getSession();


      if (error) {

        console.error(
          "Session error:",
          error
        );

        throw new Error(
          "تعذّر الحصول على جلسة الدخول."
        );
      }


      const session =
        data?.session;


      if (
        !session?.access_token
      ) {

        throw new Error(
          "جلسة الدخول منتهية. سجّل الدخول مرة ثانية."
        );
      }


      /*
       * نستخدم fetch مباشر بدلاً من invoke
       * حتى نضمن إرسال Authorization.
       */

      const response =
        await fetch(
          `${SUPABASE_URL}/functions/v1/ai-chat`,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_ANON_KEY,

              "Authorization":
                `Bearer ${session.access_token}`
            },

            body:
              JSON.stringify({
                message:
                  userMessage,

                messages:
                  state.messages,

                user_id:
                  state.user.id,

                conversation_id:
                  state.currentId
              })
          }
        );


      let result;


      try {

        result =
          await response.json();

      } catch {

        throw new Error(
          "الـ Edge Function رجعت استجابة غير صالحة."
        );
      }


      console.log(
        "Ayham AI:",
        response.status,
        result
      );


      if (!response.ok) {

        throw new Error(
          result?.error ||
          `خطأ من الخادم (${response.status})`
        );
      }


      const answer =
        extractAIReply(
          result
        );


      if (!answer) {

        throw new Error(
          result?.error ||
          "الذكاء الاصطناعي ما رجع جواب."
        );
      }


      return answer;
    }


    /* =========================================================
       SEND
    ========================================================= */

    async function sendMessage() {

      if (
        state.sending
      ) {
        return;
      }


      if (!state.user) {

        showToast(
          "سجّل الدخول أولاً.",
          true
        );

        return;
      }


      const input =
        $("messageInput");


      const text =
        input.value.trim();


      if (!text) {
        return;
      }


      state.sending =
        true;


      $("sendButton")
        .disabled = true;


      input.value =
        "";


      resizeTextarea();


      state.messages.push({
        role: "user",
        content: text
      });


      renderMessages();


      addTyping();


      try {

        const answer =
          await callAIChat(
            text
          );


        removeTyping();


        state.messages.push({
          role: "assistant",
          content: answer
        });


        renderMessages();


        await saveConversation();


      } catch (error) {

        removeTyping();


        console.error(
          "Send error:",
          error
        );


        showToast(
          error?.message ||
          "صار خطأ أثناء إرسال الرسالة.",
          true
        );


      } finally {

        state.sending =
          false;


        $("sendButton")
          .disabled = false;


        input.focus();
      }
    }


    function addTyping() {

      removeTyping();


      const row =
        document.createElement(

        );

      row.id =
        "typingMessage";

      row.className =
        "message-row assistant";


      row.innerHTML = `
        <div class="message-inner">
          <div class="avatar ai-avatar">
            AI
          </div>

          <div class="message-content">
            <div class="message-name">
              Ayham AI
            </div>

            <div class="bubble">
              <div class="typing">
                <span></span>
                <span></span>
                <span></span>
              </div>
            </div>
          </div>
        </div>
      `;


      $("messages")
        .appendChild(
          row
        );


      scrollToBottom();
    }


    function removeTyping() {

      const typing =
        $("typingMessage");


      if (typing) {
        typing.remove();
      }
    }


    function scrollToBottom() {

      const area =
        $("chatScroll");


      setTimeout(() => {

        area.scrollTop =
          area.scrollHeight;

      }, 20);
    }


    /* =========================================================
       TEXTAREA
    ========================================================= */

    function resizeTextarea() {

      const input =
        $("messageInput");


      input.style.height =
        "auto";


      input.style.height =
        Math.min(
          input.scrollHeight,
          180
        ) + "px";
    }


    /* =========================================================
       SIDEBAR
    ========================================================= */

    function openSidebar() {

      $("sidebar")
        .classList.add(
          "open"
        );

      $("sidebarOverlay")
        .classList.add(
          "open"
        );
    }


    function closeSidebar() {

      $("sidebar")
        .classList.remove(
          "open"
        );

      $("sidebarOverlay")
        .classList.remove(
          "open"
        );
    }


    /* =========================================================
       LOGOUT
    ========================================================= */

    async function logout() {

      const {
        error
      } =
        await db.auth.signOut();


      if (error) {

        showToast(
          "تعذّر تسجيل الخروج.",
          true
        );

        return;
      }


      state.user =
        null;

      state.profile =
        null;

      state.conversations =
        [];

      state.currentId =
        null;

      state.messages =
        [];


      $("app")
        .classList.add(
          "hidden"
        );

      $("authScreen")
        .classList.remove(
          "hidden"
        );


      $("emailInput")
        .value = "";

      $("passwordInput")
        .value = "";

      $("nameInput")
        .value = "";


      setAuthMode(
        "login"
      );
    }


    /* =========================================================
       INITIALIZE
    ========================================================= */

    async function initializeUser(
      user
    ) {

      if (state.initializing) {
        return;
      }


      state.initializing =
        true;


      try {

        if (!user) {

          state.user =
            null;

          state.profile =
            null;

          state.conversations =
            [];

          state.currentId =
            null;

          state.messages =
            [];


          $("app")
            .classList.add(
              "hidden"
            );

          $("authScreen")
            .classList.remove(
              "hidden"
            );


          return;
        }


        state.user =
          user;


        $("authScreen")
          .classList.add(
            "hidden"
          );

        $("app")
          .classList.remove(
            "hidden"
          );


        $("accountEmail")
          .textContent =
          user.email || "";


        await loadProfile();

        await loadConversations();


        if (
          state.conversations.length > 0
        ) {

          await loadConversation(
            state.conversations[0].id
          );

        } else {

          newConversation();
        }


      } finally {

        state.initializing =
          false;
      }
    }


    /* =========================================================
       EVENTS
    ========================================================= */

    $("authButton")
      .addEventListener(
        "click",
        handleAuth
      );


    $("switchAuth")
      .addEventListener(
        "click",
        () => {

          if (
            state.authMode ===
            "login"
          ) {

            setAuthMode(
              "signup"
            );

          } else {

            setAuthMode(
              "login"
            );
          }
        }
      );


    $("forgotButton")
      .addEventListener(
        "click",
        () => {

          setAuthMode(
            "reset"
          );
        }
      );


    $("newChatButton")
      .addEventListener(
        "click",
        newConversation
      );


    $("logoutButton")
      .addEventListener(
        "click",
        logout
      );


    $("sendButton")
      .addEventListener(
        "click",
        sendMessage
      );


    $("messageInput")
      .addEventListener(
        "input",
        resizeTextarea
      );


    $("messageInput")
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter" &&
            !event.shiftKey
          ) {

            event.preventDefault();

            sendMessage();
          }
        }
      );


    $("mobileMenuButton")
      .addEventListener(
        "click",
        openSidebar
      );


    $("sidebarOverlay")
      .addEventListener(
        "click",
        closeSidebar
      );


    /* =========================================================
       ENTER KEY AUTH
    ========================================================= */

    [
      "emailInput",
      "passwordInput",
      "nameInput"
    ].forEach(
      id => {

        $(id)
          .addEventListener(
            "keydown",
            event => {

              if (
                event.key === "Enter"
              ) {

                event.preventDefault();

                handleAuth();
              }
            }
          );
      }
    );


    /* =========================================================
       AUTH STATE
    ========================================================= */

    db.auth.onAuthStateChange(
      async (
        event,
        session
      ) => {

        /*
         * INITIAL_SESSION:
         * أول ما الموقع يفتح.
         *
         * SIGNED_IN:
         * بعد تسجيل الدخول.
         *
         * SIGNED_OUT:
         * بعد تسجيل الخروج.
         */

        if (
          session?.user
        ) {

          state.user =
            session.user;


          await initializeUser(
            session.user
          );

        } else if (
          event ===
          "SIGNED_OUT"
        ) {

          await initializeUser(
            null
          );
        }
      }
    );


    /* =========================================================
       BOOT
    ========================================================= */

    (async () => {

      try {

        const {
          data,
          error
        } =
          await db.auth.getSession();


        if (error) {

          console.error(
            "Startup session error:",
            error
          );

          setAuthMode(
            "login"
          );

          return;
        }


        if (
          data?.session?.user
        ) {

          await initializeUser(
            data.session.user
          );

        } else {

          setAuthMode(
            "login"
          );
        }


      } catch (error) {

        console.error(
          "Boot error:",
          error
        );

        setAuthMode(
          "login"
        );
      }

    })();

  </script>

</body>
</html>
