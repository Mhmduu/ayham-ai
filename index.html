<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>Ayham AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #080808;
      --panel: #111111;
      --panel2: #181818;
      --panel3: #202020;
      --border: #2b2b2b;
      --text: #f5f5f5;
      --muted: #999;
      --white: #fff;
      --danger: #ff6b6b;
      --green: #22c55e;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
    }

    body {
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       AUTH
    ========================= */

    #authScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(
          circle at top,
          #222 0%,
          #0c0c0c 45%,
          #050505 100%
        );
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #303030;
      border-radius: 28px;
      padding: 38px 30px 32px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.55);
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      background: #fff;
      color: #111;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 29px;
      font-weight: 900;
    }

    .auth-title {
      text-align: center;
      font-size: 34px;
      margin: 0;
      font-weight: 800;
    }

    .auth-subtitle {
      text-align: center;
      color: #999;
      margin: 12px 0 30px;
      font-size: 16px;
    }

    .auth-error {
      background: rgba(255, 70, 70, 0.12);
      border: 1px solid rgba(255, 90, 90, 0.35);
      color: #ff9b9b;
      padding: 13px 15px;
      border-radius: 13px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
      font-size: 15px;
    }

    .field input {
      width: 100%;
      height: 56px;
      border-radius: 15px;
      border: 1px solid #3a3a3a;
      background: #f0f4ff;
      color: #111;
      padding: 0 17px;
      outline: none;
      direction: rtl;
      font-size: 16px;
    }

    .field input:focus {
      border-color: #888;
    }

    .primary-btn {
      width: 100%;
      height: 57px;
      border: 0;
      border-radius: 15px;
      background: #fff;
      color: #111;
      font-weight: 800;
      font-size: 17px;
      margin-top: 4px;
    }

    .primary-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .secondary-btn {
      width: 100%;
      height: 55px;
      margin-top: 12px;
      border-radius: 15px;
      border: 1px solid #303030;
      background: transparent;
      color: #ddd;
    }

    .link-btn {
      display: block;
      border: 0;
      background: transparent;
      color: #aaa;
      margin: 20px auto 0;
      font-size: 15px;
    }

    .link-btn:hover {
      color: #fff;
    }

    /* =========================
       APP
    ========================= */

    #app {
      width: 100%;
      height: 100vh;
      display: flex;
      background: var(--bg);
    }

    .sidebar {
      width: 285px;
      height: 100%;
      background: #101010;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 20;
    }

    .sidebar-top {
      padding: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 7px 5px 18px;
    }

    .brand-icon {
      width: 39px;
      height: 39px;
      background: #fff;
      color: #111;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
    }

    .new-chat {
      width: 100%;
      height: 47px;
      border: 1px solid #343434;
      border-radius: 13px;
      background: #191919;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-weight: 700;
    }

    .new-chat:hover {
      background: #232323;
    }

    .conversations-title {
      color: #777;
      font-size: 12px;
      padding: 20px 8px 9px;
    }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px 10px;
    }

    .conversation-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 45px;
      border-radius: 11px;
      border: 0;
      background: transparent;
      color: #ddd;
      text-align: right;
      padding: 8px 10px;
      margin-bottom: 4px;
    }

    .conversation-item:hover {
      background: #1b1b1b;
    }

    .conversation-item.active {
      background: #242424;
    }

    .conversation-title-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 14px;
    }

    .delete-chat {
      width: 29px;
      height: 29px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #777;
      flex-shrink: 0;
    }

    .delete-chat:hover {
      color: #ff7777;
      background: #302020;
    }

    .account {
      border-top: 1px solid #282828;
      padding: 13px;
    }

    .account-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      margin-bottom: 10px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #303030;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex-shrink: 0;
    }

    .account-text {
      min-width: 0;
    }

    .account-name {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-email {
      color: #777;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      direction: ltr;
      text-align: right;
    }

    .logout-btn {
      width: 100%;
      height: 40px;
      border-radius: 10px;
      border: 1px solid #2e2e2e;
      background: transparent;
      color: #bbb;
    }

    .logout-btn:hover {
      color: #fff;
      background: #1d1d1d;
    }

    /* =========================
       CHAT
    ========================= */

    .main {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .topbar {
      height: 64px;
      border-bottom: 1px solid #202020;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      background: rgba(8, 8, 8, 0.92);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }

    .mobile-menu {
      display: none;
      width: 40px;
      height: 40px;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 23px;
      border-radius: 10px;
    }

    .mobile-menu:hover {
      background: #202020;
    }

    .top-title {
      font-weight: 700;
      font-size: 16px;
    }

    .status {
      color: #777;
      font-size: 12px;
      margin-right: auto;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .messages {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 22px 170px;
    }

    .welcome {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .welcome-logo {
      width: 70px;
      height: 70px;
      background: #fff;
      color: #111;
      border-radius: 21px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 900;
      margin-bottom: 22px;
    }

    .welcome h1 {
      margin: 0;
      font-size: 30px;
    }

    .welcome p {
      color: #888;
      margin-top: 10px;
      font-size: 15px;
    }

    .message {
      display: flex;
      gap: 13px;
      margin-bottom: 30px;
      align-items: flex-start;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
    }

    .assistant .message-avatar {
      background: #fff;
      color: #111;
    }

    .user .message-avatar {
      background: #292929;
      color: #ddd;
    }

    .message-content {
      max-width: calc(100% - 48px);
      line-height: 1.85;
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user .message-content {
      background: #202020;
      border: 1px solid #2c2c2c;
      border-radius: 17px 17px 4px 17px;
      padding: 11px 15px;
    }

    .assistant .message-content {
      padding-top: 2px;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      height: 25px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #aaa;
      animation: bounce 1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.5;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 15px 20px 20px;
      background:
        linear-gradient(
          to top,
          #080808 55%,
          rgba(8, 8, 8, 0.92) 75%,
          transparent
        );
    }

    .composer {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
    }

    .composer-box {
      display: flex;
      align-items: flex-end;
      gap: 9px;
      border: 1px solid #343434;
      background: #151515;
      border-radius: 18px;
      padding: 9px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }

    #messageInput {
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      min-height: 44px;
      max-height: 170px;
      padding: 10px 8px;
      line-height: 1.6;
      font-size: 15px;
      direction: rtl;
    }

    #messageInput::placeholder {
      color: #707070;
    }

    #sendButton {
      width: 43px;
      height: 43px;
      border: 0;
      border-radius: 13px;
      background: #fff;
      color: #111;
      font-size: 20px;
      flex-shrink: 0;
      font-weight: 900;
    }

    #sendButton:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .composer-note {
      text-align: center;
      color: #555;
      font-size: 10px;
      margin-top: 7px;
    }

    /* =========================
       TOAST
    ========================= */

    #toast {
      position: fixed;
      left: 50%;
      bottom: 95px;
      transform: translateX(-50%);
      max-width: calc(100% - 30px);
      padding: 12px 17px;
      border-radius: 13px;
      background: #242424;
      border: 1px solid #3a3a3a;
      color: #eee;
      z-index: 100;
      box-shadow: 0 15px 40px rgba(0,0,0,0.45);
      font-size: 14px;
      text-align: center;
    }

    #toast.error {
      background: #351d1d;
      border-color: #683737;
      color: #ffb1b1;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 760px) {
      .sidebar {
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        width: 285px;
        transform: translateX(105%);
        transition: transform 0.25s ease;
        box-shadow: -20px 0 60px rgba(0,0,0,0.5);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .mobile-menu {
        display: block;
      }

      .topbar {
        height: 58px;
        padding: 0 10px;
      }

      .messages {
        padding: 25px 14px 155px;
      }

      .welcome {
        min-height: 55vh;
      }

      .welcome h1 {
        font-size: 25px;
      }

      .message {
        gap: 9px;
        margin-bottom: 24px;
      }

      .message-avatar {
        width: 31px;
        height: 31px;
        border-radius: 9px;
      }

      .message-content {
        max-width: calc(100% - 40px);
        font-size: 14px;
      }

      .composer-wrap {
        padding: 8px 9px 12px;
      }

      .composer-box {
        border-radius: 17px;
      }

      #messageInput {
        font-size: 14px;
      }

      .status {
        display: none;
      }

      .auth-card {
        padding: 30px 18px 25px;
        border-radius: 23px;
      }

      .auth-title {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       AUTH SCREEN
  ========================= -->

  <section id="authScreen">

    <div class="auth-card">

      <div class="logo">AI</div>

      <h1 id="authTitle" class="auth-title">
        تسجيل الدخول
      </h1>

      <p id="authSubtitle" class="auth-subtitle">
        سجّل دخولك حتى تستخدم Ayham AI
      </p>

      <div
        id="authError"
        class="auth-error hidden"
      ></div>

      <div
        id="nameField"
        class="field hidden"
      >
        <label>الاسم</label>

        <input
          id="nameInput"
          type="text"
          autocomplete="name"
          placeholder="اكتب اسمك"
        />
      </div>

      <div class="field">
        <label>البريد الإلكتروني</label>

        <input
          id="emailInput"
          type="email"
          autocomplete="email"
          placeholder="example@gmail.com"
          dir="ltr"
        />
      </div>

      <div
        id="passwordField"
        class="field"
      >
        <label>كلمة المرور</label>

        <input
          id="passwordInput"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••"
          dir="ltr"
        />
      </div>

      <button
        id="authButton"
        class="primary-btn"
      >
        تسجيل الدخول
      </button>

      <button
        id="forgotButton"
        class="secondary-btn"
      >
        نسيت كلمة المرور؟
      </button>

      <button
        id="switchAuthButton"
        class="link-btn"
      >
        إنشاء حساب جديد
      </button>

    </div>

  </section>


  <!-- =========================
       APP
  ========================= -->

  <main
    id="app"
    class="hidden"
  >

    <!-- SIDEBAR -->

    <aside
      id="sidebar"
      class="sidebar"
    >

      <div class="sidebar-top">

        <div class="brand">

          <div class="brand-icon">
            AI
          </div>

          <div class="brand-name">
            Ayham AI
          </div>

        </div>

        <button
          id="newChatButton"
          class="new-chat"
        >
          <span>＋</span>
          <span>محادثة جديدة</span>
        </button>

        <div class="conversations-title">
          محادثاتك
        </div>

      </div>

      <div
        id="conversationList"
        class="conversation-list"
      ></div>

      <div class="account">

        <div class="account-info">

          <div
            id="avatar"
            class="avatar"
          >
            AI
          </div>

          <div class="account-text">

            <div
              id="accountName"
              class="account-name"
            >
              المستخدم
            </div>

            <div
              id="accountEmail"
              class="account-email"
            >
              —
            </div>

          </div>

        </div>

        <button
          id="logoutButton"
          class="logout-btn"
        >
          تسجيل الخروج
        </button>

      </div>

    </aside>


    <!-- MAIN -->

    <section class="main">

      <header class="topbar">

        <button
          id="mobileMenu"
          class="mobile-menu"
        >
          ☰
        </button>

        <div
          id="topTitle"
          class="top-title"
        >
          Ayham AI
        </div>

        <div
          id="statusText"
          class="status"
        >
          متصل
        </div>

      </header>


      <div
        id="chatArea"
        class="chat-area"
      >

        <div
          id="messages"
          class="messages"
        ></div>

      </div>


      <div class="composer-wrap">

        <div class="composer">

          <div class="composer-box">

            <textarea
              id="messageInput"
              rows="1"
              placeholder="اكتب رسالتك..."
              autocomplete="off"
            ></textarea>

            <button
              id="sendButton"
              title="إرسال"
            >
              ↑
            </button>

          </div>

          <div class="composer-note">
            Ayham AI قد يخطئ أحياناً، تحقق من المعلومات المهمة.
          </div>

        </div>

      </div>

    </section>

  </main>


  <div
    id="toast"
    class="hidden"
  ></div>


<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://yyhykirxcsbgfddjyuti.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_ulGr0S06yyfBBzsiJqSeRQ_p3sO5dxh";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);


/* =========================================================
   STATE
========================================================= */

const state = {
  user: null,
  profile: null,
  conversations: [],
  currentId: null,
  messages: [],
  authMode: "login",
  sending: false
};


/* =========================================================
   HELPERS
========================================================= */

function $(id) {
  return document.getElementById(id);
}


function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function showToast(message, error = false) {
  const toast = $("toast");

  toast.textContent = message;
  toast.classList.remove("hidden");

  if (error) {
    toast.classList.add("error");
  } else {
    toast.classList.remove("error");
  }

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(() => {
    toast.classList.add("hidden");
  }, 3500);
}


function showAuthError(message) {
  const box = $("authError");

  if (!message) {
    box.textContent = "";
    box.classList.add("hidden");
    return;
  }

  box.textContent = message;
  box.classList.remove("hidden");
}


function friendlyError(error) {
  const message =
    error?.message ||
    error?.error_description ||
    String(error || "");

  const text = message.toLowerCase();

  if (text.includes("invalid login credentials")) {
    return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
  }

  if (text.includes("email not confirmed")) {
    return "لازم تأكد بريدك الإلكتروني أولاً.";
  }

  if (text.includes("user already registered")) {
    return "هذا البريد مسجل مسبقاً.";
  }

  if (text.includes("password")) {
    return "كلمة المرور غير صحيحة أو قصيرة جداً.";
  }

  if (text.includes("invalid api key")) {
    return "مفتاح Supabase غير صحيح. تأكد من URL والمفتاح.";
  }

  if (text.includes("failed to fetch")) {
    return "تعذر الاتصال بـ Supabase. تأكد من الإنترنت وإعدادات المشروع.";
  }

  if (text.includes("edge function")) {
    return "تعذر الاتصال بخدمة الذكاء الاصطناعي.";
  }

  return message || "صار خطأ غير متوقع.";
}


/* =========================================================
   AUTH UI
========================================================= */

function setAuthMode(mode) {

  state.authMode = mode;

  showAuthError("");

  const isSignup = mode === "signup";
  const isReset = mode === "reset";

  $("authTitle").textContent =
    isSignup
      ? "إنشاء حساب"
      : isReset
        ? "استعادة كلمة المرور"
        : "تسجيل الدخول";

  $("authSubtitle").textContent =
    isSignup
      ? "أنشئ حسابك حتى تستخدم Ayham AI"
      : isReset
        ? "اكتب بريدك حتى نرسل لك رابط الاستعادة"
        : "سجّل دخولك حتى تستخدم Ayham AI";

  $("nameField").classList.toggle(
    "hidden",
    !isSignup
  );

  $("passwordField").classList.toggle(
    "hidden",
    isReset
  );

  $("forgotButton").classList.toggle(
    "hidden",
    isSignup || isReset
  );

  $("authButton").textContent =
    isSignup
      ? "إنشاء الحساب"
      : isReset
        ? "إرسال رابط الاستعادة"
        : "تسجيل الدخول";

  $("switchAuthButton").textContent =
    isSignup
      ? "عندي حساب بالفعل"
      : "إنشاء حساب جديد";

  $("passwordInput").value = "";

  if (isSignup) {
    $("passwordInput").autocomplete =
      "new-password";
  } else {
    $("passwordInput").autocomplete =
      "current-password";
  }
}


/* =========================================================
   AUTH
========================================================= */

async function handleAuth() {

  const email =
    $("emailInput").value.trim();

  const password =
    $("passwordInput").value;

  const name =
    $("nameInput").value.trim();

  showAuthError("");

  if (!email) {
    showAuthError("اكتب البريد الإلكتروني.");
    return;
  }

  if (!email.includes("@")) {
    showAuthError("اكتب بريد إلكتروني صحيح.");
    return;
  }

  if (
    state.authMode !== "reset" &&
    password.length < 6
  ) {
    showAuthError(
      "كلمة المرور لازم تكون 6 أحرف أو أكثر."
    );
    return;
  }

  const button = $("authButton");

  button.disabled = true;

  const oldText = button.textContent;

  button.textContent = "جاري التنفيذ...";

  try {

    if (state.authMode === "login") {

      const { error } =
        await db.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        throw error;
      }

      return;
    }


    if (state.authMode === "signup") {

      const { data, error } =
        await db.auth.signUp({
          email,
          password,
          options: {
            data: {
              display_name:
                name || email.split("@")[0]
            }
          }
        });

      if (error) {
        throw error;
      }

      if (data?.session) {
        return;
      }

      showAuthError(
        "تم إنشاء الحساب. إذا كان تأكيد البريد مفعلاً، افتح بريدك وأكد الحساب ثم سجّل الدخول."
      );

      setAuthMode("login");

      return;
    }


    if (state.authMode === "reset") {

      const { error } =
        await db.auth.resetPasswordForEmail(
          email,
          {
            redirectTo:
              window.location.origin +
              window.location.pathname
          }
        );

      if (error) {
        throw error;
      }

      showAuthError(
        "تم إرسال رابط استعادة كلمة المرور إلى بريدك."
      );

      return;
    }

  } catch (error) {

    console.error("Auth error:", error);

    showAuthError(
      friendlyError(error)
    );

  } finally {

    button.disabled = false;
    button.textContent = oldText;

  }
}


/* =========================================================
   PROFILE
========================================================= */

async function loadProfile() {

  if (!state.user) {
    return;
  }

  const { data, error } =
    await db
      .from("profiles")
      .select("id, display_name")
      .eq("id", state.user.id)
      .maybeSingle();

  if (error) {
    console.error(
      "Profile error:",
      error
    );
    return;
  }

  state.profile = data;

  const name =
    data?.display_name ||
    state.user.email?.split("@")[0] ||
    "المستخدم";

  $("accountName").textContent = name;

  $("accountEmail").textContent =
    state.user.email || "";

  $("avatar").textContent =
    name
      .trim()
      .charAt(0)
      .toUpperCase() || "AI";
}


/* =========================================================
   CONVERSATIONS
========================================================= */

async function loadConversations() {

  if (!state.user) {
    return;
  }

  const { data, error } =
    await db
      .from("conversations")
      .select(
        "id, user_id, title, messages, created_at, updated_at"
      )
      .eq("user_id", state.user.id)
      .order("updated_at", {
        ascending: false
      });

  if (error) {
    console.error(
      "Conversations error:",
      error
    );

    showToast(
      "تعذر تحميل المحادثات.",
      true
    );

    return;
  }

  state.conversations =
    Array.isArray(data)
      ? data
      : [];

  renderConversationList();

  if (
    state.currentId &&
    state.conversations.some(
      c => c.id === state.currentId
    )
  ) {
    const current =
      state.conversations.find(
        c => c.id === state.currentId
      );

    state.messages =
      Array.isArray(current.messages)
        ? current.messages
        : [];

    renderMessages();
  }
}


function renderConversationList() {

  const list =
    $("conversationList");

  list.innerHTML = "";

  if (!state.conversations.length) {

    const empty =
      document.createElement("div");

    empty.style.cssText =
      "padding:20px 10px;color:#666;font-size:13px;text-align:center;";

    empty.textContent =
      "ماكو محادثات بعد";

    list.appendChild(empty);

    return;
  }

  state.conversations.forEach(
    conversation => {

      const row =
        document.createElement("div");

      row.className =
        "conversation-item" +
        (
          conversation.id === state.currentId
            ? " active"
            : ""
        );

      const title =
        document.createElement("div");

      title.className =
        "conversation-title-text";

      title.textContent =
        conversation.title ||
        "محادثة جديدة";

      title.onclick = () => {
        openConversation(
          conversation.id
        );
      };

      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete-chat";

      deleteButton.textContent =
        "×";

      deleteButton.title =
        "حذف المحادثة";

      deleteButton.onclick = async event => {

        event.stopPropagation();

        await deleteConversation(
          conversation.id
        );
      };

      row.appendChild(title);
      row.appendChild(deleteButton);

      row.onclick = () => {
        openConversation(
          conversation.id
        );
      };

      list.appendChild(row);
    }
  );
}


async function openConversation(id) {

  const conversation =
    state.conversations.find(
      c => c.id === id
    );

  if (!conversation) {
    return;
  }

  state.currentId =
    conversation.id;

  state.messages =
    Array.isArray(conversation.messages)
      ? conversation.messages
      : [];

  $("topTitle").textContent =
    conversation.title ||
    "Ayham AI";

  renderConversationList();
  renderMessages();

  closeMobileSidebar();
}


async function createConversation(
  firstMessage = null
) {

  if (!state.user) {
    return null;
  }

  const title =
    firstMessage
      ? firstMessage
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, 45)
      : "محادثة جديدة";

  const { data, error } =
    await db
      .from("conversations")
      .insert({
        user_id: state.user.id,
        title:
          title || "محادثة جديدة",
        messages: []
      })
      .select(
        "id, user_id, title, messages, created_at, updated_at"
      )
      .single();

  if (error) {
    console.error(
      "Create conversation:",
      error
    );

    showToast(
      "تعذر إنشاء المحادثة.",
      true
    );

    return null;
  }

  state.conversations.unshift(data);

  state.currentId =
    data.id;

  state.messages = [];

  $("topTitle").textContent =
    data.title;

  renderConversationList();

  renderMessages();

  return data;
}


async function saveCurrentConversation() {

  if (
    !state.user ||
    !state.currentId
  ) {
    return;
  }

  const conversation =
    state.conversations.find(
      c => c.id === state.currentId
    );

  if (!conversation) {
    return;
  }

  const { data, error } =
    await db
      .from("conversations")
      .update({
        messages: state.messages,
        title:
          conversation.title ||
          "محادثة جديدة",
        updated_at:
          new Date().toISOString()
      })
      .eq("id", state.currentId)
      .eq("user_id", state.user.id)
      .select(
        "id, user_id, title, messages, created_at, updated_at"
      )
      .single();

  if (error) {

    console.error(
      "Save conversation:",
      error
    );

    showToast(
      "تعذر حفظ المحادثة.",
      true
    );

    return;
  }

  const index =
    state.conversations.findIndex(
      c => c.id === state.currentId
    );

  if (index !== -1) {
    state.conversations[index] =
      data;
  }

  state.conversations.sort(
    (a, b) =>
      new Date(b.updated_at) -
      new Date(a.updated_at)
  );

  renderConversationList();
}


async function deleteConversation(id) {

  if (!state.user) {
    return;
  }

  const ok =
    confirm(
      "هل تريد حذف هذه المحادثة؟"
    );

  if (!ok) {
    return;
  }

  const { error } =
    await db
      .from("conversations")
      .delete()
      .eq("id", id)
      .eq("user_id", state.user.id);

  if (error) {

    console.error(
      "Delete conversation:",
      error
    );

    showToast(
      "تعذر حذف المحادثة.",
      true
    );

    return;
  }

  state.conversations =
    state.conversations.filter(
      c => c.id !== id
    );

  if (state.currentId === id) {

    state.currentId = null;
    state.messages = [];

    $("topTitle").textContent =
      "Ayham AI";

    renderMessages();
  }

  renderConversationList();
}


/* =========================================================
   MESSAGES UI
========================================================= */

function renderMessages() {

  const container =
    $("messages");

  container.innerHTML = "";

  if (!state.messages.length) {

    const welcome =
      document.createElement("div");

    welcome.className =
      "welcome";

    welcome.innerHTML = `
      <div class="welcome-logo">AI</div>
      <h1>شلون أگدر أساعدك؟</h1>
      <p>
        اسألني عن أي شي، اكتب كود، اطلب شرح أو فكرة.
      </p>
    `;

    container.appendChild(
      welcome
    );

    return;
  }

  state.messages.forEach(
    message => {

      if (
        !message ||
        !message.role ||
        typeof message.content !== "string"
      ) {
        return;
      }

      addMessageElement(
        message.role,
        message.content
      );
    }
  );

  scrollToBottom();
}


function addMessageElement(
  role,
  content
) {

  const container =
    $("messages");

  const message =
    document.createElement("div");

  message.className =
    "message " +
    (
      role === "user"
        ? "user"
        : "assistant"
    );

  const avatar =
    document.createElement("div");

  avatar.className =
    "message-avatar";

  avatar.textContent =
    role === "user"
      ? "أنت"
      : "AI";

  const body =
    document.createElement("div");

  body.className =
    "message-content";

  body.textContent =
    content;

  message.appendChild(
    avatar
  );

  message.appendChild(
    body
  );

  container.appendChild(
    message
  );

  return message;
}


function addTypingMessage() {

  const container =
    $("messages");

  const message =
    document.createElement("div");

  message.className =
    "message assistant";

  message.id =
    "typingMessage";

  message.innerHTML = `
    <div class="message-avatar">
      AI
    </div>

    <div class="message-content">
      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  `;

  container.appendChild(
    message
  );

  scrollToBottom();
}


function removeTypingMessage() {

  const typing =
    $("typingMessage");

  if (typing) {
    typing.remove();
  }
}


function scrollToBottom() {

  const area =
    $("chatArea");

  setTimeout(() => {
    area.scrollTop =
      area.scrollHeight;
  }, 30);
}


/* =========================================================
   AI
========================================================= */

async function callAIChat() {

  if (!state.user) {
    throw new Error(
      "لازم تسجل الدخول أولاً."
    );
  }

  if (!state.messages.length) {
    throw new Error(
      "ماكو رسائل للإرسال."
    );
  }

  const sessionResult =
    await db.auth.getSession();

  const session =
    sessionResult?.data?.session;

  if (!session?.access_token) {
    throw new Error(
      "جلسة الدخول منتهية. سجّل الدخول مرة ثانية."
    );
  }

  /*
    نرسل الرسائل إلى Edge Function.
    الـ Edge Function هو المسؤول عن OpenRouter.
  */

  const { data, error } =
    await db.functions.invoke(
      "ai-chat",
      {
        body: {
          messages:
            state.messages.slice(-20)
        },
        headers: {
          Authorization:
            `Bearer ${session.access_token}`
        }
      }
    );

  if (error) {

    console.error(
      "Edge Function invoke error:",
      error
    );

    throw new Error(
      "فشل الاتصال بـ ai-chat. تأكد أن Edge Function منشورة وأن اسمها ai-chat."
    );
  }

  if (!data) {
    throw new Error(
      "خدمة الذكاء الاصطناعي لم ترجع بيانات."
    );
  }

  if (data.error) {
    throw new Error(
      data.error
    );
  }

  const reply =
    data.reply ||
    data.answer ||
    data.message ||
    data.content;

  if (
    typeof reply !== "string" ||
    !reply.trim()
  ) {
    console.error(
      "Invalid AI response:",
      data
    );

    throw new Error(
      "الذكاء الاصطناعي لم يرجع جواباً."
    );
  }

  return reply.trim();
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

  if (state.sending) {
    return;
  }

  if (!state.user) {
    showToast(
      "لازم تسجل الدخول أولاً.",
      true
    );
    return;
  }

  const input =
    $("messageInput");

  const text =
    input.value.trim();

  if (!text) {
    return;
  }

  state.sending = true;

  $("sendButton").disabled =
    true;

  input.disabled =
    true;

  try {

    /*
      إذا ما عندنا محادثة حالية،
      ننشئ وحدة جديدة.
    */

    if (!state.currentId) {

      const created =
        await createConversation(
          text
        );

      if (!created) {
        throw new Error(
          "تعذر إنشاء المحادثة."
        );
      }
    }

    /*
      إضافة رسالة المستخدم
    */

    state.messages.push({
      role: "user",
      content: text
    });

    input.value = "";

    autoResizeTextarea();

    renderMessages();

    await saveCurrentConversation();

    addTypingMessage();

    /*
      استدعاء الذكاء الاصطناعي
    */

    const reply =
      await callAIChat();

    removeTypingMessage();

    /*
      إضافة رد AI
    */

    state.messages.push({
      role: "assistant",
      content: reply
    });

    renderMessages();

    await saveCurrentConversation();

  } catch (error) {

    console.error(
      "Send message error:",
      error
    );

    removeTypingMessage();

    showToast(
      friendlyError(error),
      true
    );

  } finally {

    state.sending = false;

    $("sendButton").disabled =
      false;

    input.disabled =
      false;

    input.focus();
  }
}


/* =========================================================
   NEW CHAT
========================================================= */

async function newChat() {

  state.currentId = null;
  state.messages = [];

  $("topTitle").textContent =
    "Ayham AI";

  renderMessages();

  closeMobileSidebar();

  $("messageInput").focus();
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

  const { error } =
    await db.auth.signOut();

  if (error) {
    showToast(
      friendlyError(error),
      true
    );
  }

  state.user = null;
  state.profile = null;
  state.conversations = [];
  state.currentId = null;
  state.messages = [];

  $("app").classList.add(
    "hidden"
  );

  $("authScreen").classList.remove(
    "hidden"
  );

  $("emailInput").value = "";
  $("passwordInput").value = "";
  $("nameInput").value = "";

  setAuthMode("login");
}


/* =========================================================
   INITIALIZE USER
========================================================= */

async function initializeUser(
  user
) {

  state.user = user;

  $("authScreen").classList.add(
    "hidden"
  );

  $("app").classList.remove(
    "hidden"
  );

  await loadProfile();

  await loadConversations();

  /*
    إذا ما عنده محادثة،
    نخلي الصفحة الرئيسية فاضية.
  */

  if (!state.currentId) {
    state.messages = [];
    renderMessages();
  }
}


/* =========================================================
   SESSION
========================================================= */

async function checkSession() {

  try {

    const {
      data,
      error
    } = await db.auth.getSession();

    if (error) {
      throw error;
    }

    if (data?.session?.user) {

      await initializeUser(
        data.session.user
      );

    } else {

      $("authScreen").classList.remove(
        "hidden"
      );

      $("app").classList.add(
        "hidden"
      );

    }

  } catch (error) {

    console.error(
      "Session error:",
      error
    );

    showAuthError(
      friendlyError(error)
    );
  }
}


/* =========================================================
   AUTH STATE CHANGE
========================================================= */

db.auth.onAuthStateChange(
  async (event, session) => {

    console.log(
      "Auth event:",
      event
    );

    if (
      session?.user &&
      (
        event === "SIGNED_IN" ||
        event === "INITIAL_SESSION" ||
        event === "TOKEN_REFRESHED"
      )
    ) {

      /*
        ننتظر حتى لا تتداخل عملية
        تغيير الحالة مع Supabase.
      */

      setTimeout(
        async () => {
          await initializeUser(
            session.user
          );
        },
        0
      );

      return;
    }

    if (event === "SIGNED_OUT") {

      state.user = null;
      state.profile = null;
      state.conversations = [];
      state.currentId = null;
      state.messages = [];

      $("app").classList.add(
        "hidden"
      );

      $("authScreen").classList.remove(
        "hidden"
      );

      setAuthMode("login");
    }
  }
);


/* =========================================================
   TEXTAREA
========================================================= */

function autoResizeTextarea() {

  const input =
    $("messageInput");

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      170
    ) + "px";
}


/* =========================================================
   MOBILE SIDEBAR
========================================================= */

function openMobileSidebar() {

  $("sidebar").classList.add(
    "open"
  );
}


function closeMobileSidebar() {

  $("sidebar").classList.remove(
    "open"
  );
}


/* =========================================================
   EVENTS
========================================================= */

$("authButton").addEventListener(
  "click",
  handleAuth
);


$("forgotButton").addEventListener(
  "click",
  () => {
    setAuthMode("reset");
  }
);


$("switchAuthButton").addEventListener(
  "click",
  () => {

    if (
      state.authMode === "signup"
    ) {
      setAuthMode("login");
    } else {
      setAuthMode("signup");
    }
  }
);


$("logoutButton").addEventListener(
  "click",
  logout
);


$("newChatButton").addEventListener(
  "click",
  newChat
);


$("sendButton").addEventListener(
  "click",
  sendMessage
);


$("mobileMenu").addEventListener(
  "click",
  () => {

    if (
      $("sidebar").classList.contains(
        "open"
      )
    ) {
      closeMobileSidebar();
    } else {
      openMobileSidebar();
    }
  }
);


$("messageInput").addEventListener(
  "input",
  autoResizeTextarea
);


$("messageInput").addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();
    }
  }
);


/*
  Enter داخل تسجيل الدخول
*/

[
  "emailInput",
  "passwordInput",
  "nameInput"
].forEach(id => {

  $(id).addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        handleAuth();
      }
    }
  );
});


/* =========================================================
   START
========================================================= */

setAuthMode("login");

checkSession();

</script>
